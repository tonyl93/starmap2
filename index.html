          const b = NODE_MAP[bId];
          if (!a || !b) return;
          const isCrownLink = (aId === '米' && b.domain === 'leap') || (bId === '米' && a.domain === 'leap');
          const midX = (a.x + b.x) / 2;
          const midY = (a.y + b.y) / 2;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const curveBias = isCrownLink ? 0.07 : 0.06;
          const cx = midX - dy * curveBias;
          const cy = midY + dx * curveBias;

          const strokeColor = isCrownLink
            ? '#c084fc'
            : (b.domain !== 'core' ? getNodeColor(b) : getNodeColor(a));

          linksLayer.appendChild(svgEl('path', {
            d: `M ${a.x} ${a.y} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x} ${b.y}`,
            fill: 'none',
            stroke: strokeColor,
            'stroke-width': isCrownLink ? 1.25 : 1.05,
            'stroke-linecap': 'round',
            opacity: isCrownLink ? 0.34 : 0.24,
            'data-from': aId,
            'data-to': bId,
            class: 'star-link'
          }));
        });

        // 4. 演化主脉：一 → 十 → 木 → 米（纯净收束于「米」，精准贯过「才」与「果」）
        const p1 = NODE_MAP['一'];
        const p2 = NODE_MAP['十'];
        const p3 = NODE_MAP['木'];
        const p4 = NODE_MAP['米'];
        axisMainPathStr =
          `M ${p1.x} ${p1.y} ` +
          `Q 345 992 ${p2.x} ${p2.y} ` +
          `Q 705 805 ${p3.x} ${p3.y} ` +
          `Q 1290 695 ${p4.x} ${p4.y}`;

        axisLayer.appendChild(svgEl('path', {
          d: axisMainPathStr,
          fill: 'none',
          stroke: 'url(#axisGradient)',
          'stroke-width': 7.5,
          'stroke-linecap': 'round',
          opacity: 0.16,
          filter: 'url(#glowSoft)',
          class: 'axis-base-glow'
        }));
        axisLayer.appendChild(svgEl('path', {
          d: axisMainPathStr,
          fill: 'none',
          stroke: 'url(#axisGradient)',
          'stroke-width': 2.2,
          'stroke-linecap': 'round',
          opacity: 0.72,
          class: 'axis-base-line'
        }));
        axisLayer.appendChild(svgEl('path', {
          d: axisMainPathStr,
          fill: 'none',
          stroke: '#fef3c7',
          'stroke-width': 1.8,
          'stroke-linecap': 'round',
          opacity: 0.78,
          class: 'axis-flow-line'
        }));

        // 5. 「一」元标尺七星流动铂金轨迹（一 → 士 · 土 · 干 → 本 · 末 → 来）
        const mYi = NODE_MAP['一'];
        const mShi = NODE_MAP['士'];
        const mTu = NODE_MAP['土'];
        const mGan = NODE_MAP['干'];
        const mBen = NODE_MAP['本'];
        const mMo = NODE_MAP['末'];
        const mLai = NODE_MAP['来'];

        [
          `M ${mYi.x} ${mYi.y} Q 250 905 ${mShi.x} ${mShi.y}`,
          `M ${mYi.x} ${mYi.y} Q 315 1140 ${mTu.x} ${mTu.y}`,
          `M ${mShi.x} ${mShi.y} Q 425 708 ${mGan.x} ${mGan.y}`,
          `M ${mTu.x} ${mTu.y} Q 520 945 ${mGan.x} ${mGan.y}`,
          `M ${mGan.x} ${mGan.y} Q 640 618 ${mBen.x} ${mBen.y}`,
          `M ${mBen.x} ${mBen.y} Q 915 510 ${mMo.x} ${mMo.y}`,
          `M ${mMo.x} ${mMo.y} Q 1390 365 ${mLai.x} ${mLai.y}`
        ].forEach(d => {
          metaRulerLayer.appendChild(svgEl('path', {
            d,
            fill: 'none',
            stroke: 'url(#metaRulerGrad)',
            'stroke-width': 5.5,
            'stroke-linecap': 'round',
            opacity: 0.22,
            filter: 'url(#glowSoft)'
          }));
          metaRulerLayer.appendChild(svgEl('path', {
            d,
            fill: 'none',
            stroke: 'url(#metaRulerGrad)',
            'stroke-width': 2.0,
            'stroke-linecap': 'round',
            opacity: 0.88,
            class: 'meta-ruler-flow'
          }));
        });
        metaRulerLayer.style.opacity = '0';
        metaRulerLayer.style.pointerEvents = 'none';
        metaRulerLayer.style.transition = 'opacity 0.35s ease';

        // 6. 七大外绕星域竖排柔色边款（缩放在 0.70 ↔ 0.50 间柔和呼吸）
        Object.values(DOMAINS).forEach(dom => {
          if (!dom.marginalia) return;
          const m = dom.marginalia;
          const mg = svgEl('g', {
            transform: `translate(${m.x}, ${m.y})`,
            opacity: 0.70,
            filter: 'url(#marginaliaShadow)',
            'data-domain-marginalia': dom.id,
            class: 'domain-marginalia'
          });

          mg.appendChild(svgEl('circle', {
            cx: 0, cy: -28, r: 2.1,
            fill: m.tint, opacity: 0.92
          }));
          mg.appendChild(svgEl('line', {
            x1: 0, y1: -22, x2: 0, y2: -6,
            stroke: m.tint, 'stroke-width': 1.05, 'stroke-linecap': 'round', opacity: 0.85
          }));

          const textEl = svgEl('text', {
            x: 0, y: 12,
            'text-anchor': 'middle',
            fill: m.tint,
            class: 'marginalia-text'
          });
          Array.from(m.text).forEach((ch, idx) => {
            const tspan = svgEl('tspan', { x: 0, dy: idx === 0 ? '0' : '25' });
            tspan.textContent = ch;
            textEl.appendChild(tspan);
          });
          mg.appendChild(textEl);
          marginaliaLayer.appendChild(mg);
        });

        // 7. 渲染全部 42 颗星宿（四字星注严格置于圆环正下方，「番」无任何田字装饰）
        NODES.forEach(node => {
          const color = getNodeColor(node);
          const isCore = node.domain === 'core';
          const isMi = node.id === '米';

          const g = svgEl('g', {
            transform: `translate(${node.x}, ${node.y})`,
            'data-id': node.id,
            class: 'star-node'
          });

          if (isCore || node.domain === 'leap') {
            g.appendChild(svgEl('circle', {
              cx: 0, cy: 0, r: node.r + (isMi ? 16 : 10),
              fill: 'none',
              stroke: color,
              'stroke-width': isMi ? 1.5 : 1.0,
              opacity: isMi ? 0.36 : 0.24,
              class: 'node-halo-pulse'
            }));
          }

          if (isMi) {
            for (let k = 0; k < 8; k++) {
              const ang = (Math.PI / 4) * k;
              const x1 = Math.cos(ang) * (node.r + 5);
              const y1 = Math.sin(ang) * (node.r + 5);
              const x2 = Math.cos(ang) * (node.r + (k % 2 === 0 ? 18 : 13));
              const y2 = Math.sin(ang) * (node.r + (k % 2 === 0 ? 18 : 13));
              g.appendChild(svgEl('line', {
                x1: x1.toFixed(1), y1: y1.toFixed(1),
                x2: x2.toFixed(1), y2: y2.toFixed(1),
                stroke: '#f5c469', 'stroke-width': k % 2 === 0 ? 1.3 : 0.9,
                'stroke-linecap': 'round', opacity: 0.55
              }));
            }
          }

          g.appendChild(svgEl('circle', {
            cx: 0, cy: 0, r: node.r + 7,
            fill: 'none',
            stroke: '#fde68a',
            'stroke-width': 2.0,
            'stroke-dasharray': '4 4',
            opacity: 0,
            class: 'node-select-ring'
          }));

          g.appendChild(svgEl('circle', {
            cx: 0, cy: 0, r: node.r,
            fill: isCore ? 'rgba(13, 19, 38, 0.94)' : 'rgba(9, 14, 30, 0.90)',
            stroke: color,
            'stroke-width': isCore ? 2.4 : 1.65,
            filter: isCore ? 'url(#glowSoft)' : 'none',
            class: 'node-core-ring'
          }));

          const glyphEl = svgEl('text', {
            x: 0, y: 1,
            fill: isCore ? '#fff8e6' : '#f4f7fd',
            'font-size': isMi ? 32 : (isCore ? 25 : (node.domain === 'leap' ? 21 : 19)),
            class: 'node-glyph'
          });
          glyphEl.textContent = node.id;
          g.appendChild(glyphEl);

          if (node.isTraditional) {
            const sx = node.r * 0.68;
            const sy = -node.r * 0.72;
            const sealG = svgEl('g', { transform: `translate(${sx.toFixed(1)}, ${sy.toFixed(1)})` });
            sealG.appendChild(svgEl('rect', {
              x: -6.5, y: -6.5, width: 13, height: 13, rx: 3,
              fill: '#c83e37', stroke: '#f7a69f', 'stroke-width': 0.8
            }));
            const st = svgEl('text', { x: 0, y: 0.4, class: 'seal-text' });
            st.textContent = '繁';
            sealG.appendChild(st);
            g.appendChild(sealG);
          }

          // 四字星注统一置于圆环正下方
          const noteEl = svgEl('text', {
            x: 0,
            y: node.r + 18,
            fill: isCore ? '#ebd9b2' : '#aab8d0',
            class: 'node-note'
          });
          noteEl.textContent = node.note;
          g.appendChild(noteEl);

          g.addEventListener('mouseenter', () => {
            state.hoveredId = node.id;
            updateVisuals();
          });
          g.addEventListener('mouseleave', () => {
            if (state.hoveredId === node.id) {
              state.hoveredId = null;
              updateVisuals();
            }
          });
          g.addEventListener('click', (e) => {
            e.stopPropagation();
            if (dragMoved) return;
            if (state.tourActive) stopTour(false);
            if (node.id === '一') {
              triggerYiPulse();
            }
            selectNode(node.id, true, true);
          });
          g.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            focusNodesSmooth([node.id], 1.15);
          });

          nodesLayer.appendChild(g);
        });
      }

      /* 点击「一」沿演化主脉送出约 1 秒流光脉冲 */
      function triggerYiPulse() {
        if (state.yiPulseTimer) clearTimeout(state.yiPulseTimer);
        const existing = axisLayer.querySelector('.yi-pulse-path');
        if (existing) existing.remove();

        const pulse = svgEl('path', {
          d: axisMainPathStr,
          fill: 'none',
          stroke: '#fef3c7',
          'stroke-width': 4.4,
          'stroke-linecap': 'round',
          filter: 'url(#glowStrong)',
          class: 'yi-pulse-path'
        });
        axisLayer.appendChild(pulse);
        state.yiPulseTimer = setTimeout(() => {
          pulse.remove();
        }, 1120);
      }

      /* =====================================================================
         九、全局视觉状态同步与七大竖排边款缩放呼吸（0.70 ↔ 0.50）
         ===================================================================== */
      function nodeMatchesFilter(node) {
        if (state.activeFilter === 'all') return true;
        if (state.activeFilter === 'relics') return Boolean(node.isTraditional);
        return node.domain === state.activeFilter;
      }

      function isMetaTrajectoryVisible() {
        if (state.metaRulerActive) return true;
        if (state.tourActive && TOUR_CHAPTERS[state.tourIndex] && TOUR_CHAPTERS[state.tourIndex].showMetaInTour) {
          return true;
        }
        return false;
      }

      function updateMarginaliaOpacity() {
        // 缩放呼吸：全览清晰提亮至 0.70，放大细读平滑线性淡退至 0.50 下限（绝不低于 0.50）
        const relZoom = state.camera.scale / Math.max(0.05, state.fitScale);
        const t = Math.max(0, Math.min(1, (relZoom - 1.0) / 0.85));
        const breathOp = 0.70 - t * (0.70 - 0.50);
        const showMeta = isMetaTrajectoryVisible();

        marginaliaLayer.querySelectorAll('.domain-marginalia').forEach(mg => {
          const domId = mg.getAttribute('data-domain-marginalia');
          let targetOp = breathOp;

          if (!state.showStarNotes) {
            targetOp = 0;
          } else if (showMeta) {
            targetOp = 0.08;
          } else if (state.activeFilter !== 'all') {
            targetOp = domId === state.activeFilter ? 0.82 : 0.08;
          } else if (state.tourActive && state.tourFocusSet) {
            let inTour = false;
            state.tourFocusSet.forEach(fid => {
              if (NODE_MAP[fid] && NODE_MAP[fid].domain === domId) inTour = true;
            });
            targetOp = inTour ? Math.min(0.80, breathOp + 0.08) : 0.08;
          }

          mg.style.opacity = targetOp.toFixed(3);
        });
      }

      function updateVisuals() {
        const selectedNode = state.selectedId ? NODE_MAP[state.selectedId] : null;
        const relatedSet = new Set(selectedNode ? selectedNode.related : []);
        if (selectedNode) relatedSet.add(selectedNode.id);
        const showMeta = isMetaTrajectoryVisible();

        nodesLayer.querySelectorAll('.star-node').forEach(g => {
          const id = g.getAttribute('data-id');
          const node = NODE_MAP[id];
          const isSelected = id === state.selectedId;
          const isHovered = id === state.hoveredId;
          const inTour = state.tourActive && state.tourFocusSet && state.tourFocusSet.has(id);
          const inMeta = showMeta && META_RULER_IDS.has(id);
          const matchFilter = nodeMatchesFilter(node);

          let nodeOpacity = 1;
          if (showMeta) {
            nodeOpacity = inMeta ? 1 : 0.16;
          } else if (state.tourActive && state.tourFocusSet) {
            nodeOpacity = inTour ? 1 : 0.18;
          } else if (state.activeFilter !== 'all') {
            nodeOpacity = matchFilter ? 1 : 0.15;
          } else if (selectedNode && !relatedSet.has(id) && !isHovered) {
            nodeOpacity = 0.42;
          }

          g.style.opacity = String(nodeOpacity);

          const selRing = g.querySelector('.node-select-ring');
          if (selRing) {
            selRing.style.opacity = (isSelected || inMeta) ? '0.92' : (isHovered ? '0.52' : '0');
          }

          const noteEl = g.querySelector('.node-note');
          if (noteEl) {
            const tempFocus = isHovered || isSelected || inTour || inMeta;
            if (state.showStarNotes) {
              noteEl.style.opacity = nodeOpacity > 0.35 ? '0.92' : '0.32';
              noteEl.setAttribute('fill', tempFocus ? '#fde68a' : (node.domain === 'core' ? '#ebd9b2' : '#aab8d0'));
            } else {
              noteEl.style.opacity = tempFocus ? '0.96' : '0';
              noteEl.setAttribute('fill', '#fde68a');
            }
          }
        });

        linksLayer.querySelectorAll('.star-link').forEach(path => {
          const from = path.getAttribute('data-from');
          const to = path.getAttribute('data-to');
          const na = NODE_MAP[from];
          const nb = NODE_MAP[to];
          const isCrownLink = (from === '米' && nb.domain === 'leap') || (to === '米' && na.domain === 'leap');
          let op = isCrownLink ? 0.34 : 0.24;

          if (showMeta) {
            op = 0.05;
          } else if (state.tourActive && state.tourFocusSet) {
            op = (state.tourFocusSet.has(from) && state.tourFocusSet.has(to)) ? 0.56 : 0.06;
          } else if (state.activeFilter !== 'all') {
            if (state.activeFilter === 'core') {
              op = 0.05;
            } else {
              op = (nodeMatchesFilter(na) && nodeMatchesFilter(nb)) ||
                   (from === '米' && nodeMatchesFilter(nb)) ||
                   (from === '木' && nodeMatchesFilter(nb)) ||
                   (from === '十' && nodeMatchesFilter(nb))
                ? 0.45 : 0.05;
            }
          } else if (selectedNode) {
            op = (from === selectedNode.id || to === selectedNode.id) ? 0.62 : 0.1;
          }
          path.style.opacity = String(op);
        });

        const axisDim = showMeta ||
          (state.activeFilter !== 'all' && state.activeFilter !== 'core' && state.activeFilter !== 'calib' && state.activeFilter !== 'wood');
        axisLayer.style.opacity = axisDim ? '0.18' : '1';
        metaRulerLayer.style.opacity = showMeta ? '1' : '0';

        dynamicArcLayer.innerHTML = '';
        if (state.jumpArc) {
          const a = NODE_MAP[state.jumpArc.from];
          const b = NODE_MAP[state.jumpArc.to];
          if (a && b) {
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const cx = mx - dy * 0.16;
            const cy = my + dx * 0.16;
            dynamicArcLayer.appendChild(svgEl('path', {
              d: `M ${a.x} ${a.y} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x} ${b.y}`,
              fill: 'none',
              stroke: '#fde68a',
              'stroke-width': 2.6,
              'stroke-linecap': 'round',
              filter: 'url(#glowSoft)',
              class: 'jump-arc-path'
            }));
          }
        }

        updateMarginaliaOpacity();
      }

      /* =====================================================================
         十、镜头平移、缩放与“上赏孤星、下读星笺”智能运镜
         ===================================================================== */
      function getVisibleRect() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isMobile = w <= 768;
        const drawerOpen = detailDrawer.classList.contains('open');

        if (isMobile) {
          const top = 92;
          if (drawerOpen) {
            const measuredH = detailDrawer.offsetHeight || Math.round(h * 0.60);
            const cardSpace = Math.min(Math.round(h * 0.62), measuredH) + 18;
            const skyH = Math.max(96, h - top - cardSpace);
            return {
              left: 14,
              top,
              width: Math.max(180, w - 28),
              height: skyH
            };
          }
          return {
            left: 10,
            top,
            width: Math.max(180, w - 20),
            height: Math.max(180, h - top - 58)
          };
        }

        const top = 96;
        const bottom = 78;
        const left = 24;
        const right = drawerOpen ? 424 : 64;
        return {
          left,
          top,
          width: Math.max(220, w - left - right),
          height: Math.max(200, h - top - bottom)
        };
      }

      function applyCamera() {
        viewportGroup.setAttribute(
          'transform',
          `translate(${state.camera.tx.toFixed(2)}, ${state.camera.ty.toFixed(2)}) scale(${state.camera.scale.toFixed(4)})`
        );
        updateMarginaliaOpacity();
      }

      function animateCameraTo(targetTx, targetTy, targetScale, duration = 560) {
        if (state.animId) cancelAnimationFrame(state.animId);
        const startTx = state.camera.tx;
        const startTy = state.camera.ty;
        const startScale = state.camera.scale;
        const startTime = performance.now();

        function step(now) {
          const p = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - p, 3);
          state.camera.tx = startTx + (targetTx - startTx) * ease;
          state.camera.ty = startTy + (targetTy - startTy) * ease;
          state.camera.scale = startScale + (targetScale - startScale) * ease;
          applyCamera();
          if (p < 1) {
            state.animId = requestAnimationFrame(step);
          } else {
            state.animId = null;
          }
        }
        state.animId = requestAnimationFrame(step);
      }

      function computeFitMetrics() {
        const rect = getVisibleRect();
        const minX = 115, maxX = 2530, minY = 175, maxY = 1350;
        const boxW = maxX - minX;
        const boxH = maxY - minY;
        const scale = Math.max(0.14, Math.min(1.15, Math.min(rect.width / boxW, rect.height / boxH) * 0.96));
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        return {
          scale,
          tx: rect.left + rect.width / 2 - cx * scale,
          ty: rect.top + rect.height / 2 - cy * scale
        };
      }

      function fitToViewport(animated = true) {
        const m = computeFitMetrics();
        state.fitScale = m.scale;
        if (animated) {
          animateCameraTo(m.tx, m.ty, m.scale, 580);
        } else {
          state.camera = { tx: m.tx, ty: m.ty, scale: m.scale };
          applyCamera();
        }
      }

      function focusNodesSmooth(ids, maxZoom = 1.12) {
        const pts = ids.map(id => NODE_MAP[id]).filter(Boolean);
        if (!pts.length) return;
        const rect = getVisibleRect();
        const isMobile = window.innerWidth <= 768;
        const drawerOpen = detailDrawer.classList.contains('open');

        // 移动端打开悬浮星笺并聚焦单星时：柔和托举孤星至卡片上方星空中央
        if (isMobile && drawerOpen && pts.length === 1) {
          const p = pts[0];
          const targetScale = Math.max(0.68, Math.min(0.95, Math.max(state.camera.scale, 0.78)));
          const centerY = rect.top + rect.height * 0.48;
          const targetTx = rect.left + rect.width / 2 - p.x * targetScale;
          const targetTy = centerY - p.y * targetScale;
          animateCameraTo(targetTx, targetTy, targetScale, 520);
          return;
        }

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pts.forEach(p => {
          const pad = p.r + 75;
          minX = Math.min(minX, p.x - pad);
          maxX = Math.max(maxX, p.x + pad);
          minY = Math.min(minY, p.y - pad);
          maxY = Math.max(maxY, p.y + pad);
        });

        const bw = Math.max(280, maxX - minX);
        const bh = Math.max(240, maxY - minY);
        const rawScale = Math.min(rect.width / bw, rect.height / bh) * 0.88;
        const targetScale = Math.max(0.24, Math.min(maxZoom, rawScale));
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const targetTx = rect.left + rect.width / 2 - cx * targetScale;
        const targetTy = rect.top + rect.height / 2 - cy * targetScale;
        animateCameraTo(targetTx, targetTy, targetScale, 580);
      }

      function zoomAtPoint(factor, clientX, clientY) {
        if (state.animId) {
          cancelAnimationFrame(state.animId);
          state.animId = null;
        }
        const oldScale = state.camera.scale;
        const newScale = Math.max(0.16, Math.min(2.3, oldScale * factor));
        const ratio = newScale / oldScale;
        state.camera.tx = clientX - (clientX - state.camera.tx) * ratio;
        state.camera.ty = clientY - (clientY - state.camera.ty) * ratio;
        state.camera.scale = newScale;
        applyCamera();
      }

      /* =====================================================================
         十一、指针拖拽、双指捏合缩放与双击聚焦（严禁点击空白关闭元标尺）
         ===================================================================== */
      let isDragging = false;
      let dragMoved = false;
      let dragStartX = 0, dragStartY = 0;
      let camStartX = 0, camStartY = 0;

      mapStage.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (state.animId) {
          cancelAnimationFrame(state.animId);
          state.animId = null;
        }
        isDragging = true;
        dragMoved = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        camStartX = state.camera.tx;
        camStartY = state.camera.ty;
        mapStage.classList.add('dragging');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > 4) dragMoved = true;
        state.camera.tx = camStartX + dx;
        state.camera.ty = camStartY + dy;
        applyCamera();
      });

      window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        mapStage.classList.remove('dragging');
        setTimeout(() => { dragMoved = false; }, 30);
      });

      mapStage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      let touchMode = null;
      let lastPinchDist = 0;
      let lastTapTime = 0;
      let lastTapX = 0, lastTapY = 0;

      mapStage.addEventListener('touchstart', (e) => {
        if (state.animId) {
          cancelAnimationFrame(state.animId);
          state.animId = null;
        }
        if (e.touches.length === 1) {
          touchMode = 'pan';
          dragMoved = false;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          camStartX = state.camera.tx;
          camStartY = state.camera.ty;
        } else if (e.touches.length === 2) {
          touchMode = 'pinch';
          dragMoved = true;
          const dx = e.touches[1].clientX - e.touches[0].clientX;
          const dy = e.touches[1].clientY - e.touches[0].clientY;
          lastPinchDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      mapStage.addEventListener('touchmove', (e) => {
        if (touchMode === 'pan' && e.touches.length === 1) {
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          if (Math.hypot(dx, dy) > 5) dragMoved = true;
          state.camera.tx = camStartX + dx;
          state.camera.ty = camStartY + dy;
          applyCamera();
        } else if (touchMode === 'pinch' && e.touches.length === 2) {
          e.preventDefault();
          const dx = e.touches[1].clientX - e.touches[0].clientX;
          const dy = e.touches[1].clientY - e.touches[0].clientY;
          const dist = Math.hypot(dx, dy);
          if (lastPinchDist > 10) {
            const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            zoomAtPoint(dist / lastPinchDist, cx, cy);
          }
          lastPinchDist = dist;
        }
      }, { passive: false });

      mapStage.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
          if (touchMode === 'pan' && !dragMoved && e.changedTouches.length === 1) {
            const now = Date.now();
            const tx = e.changedTouches[0].clientX;
            const ty = e.changedTouches[0].clientY;
            if (now - lastTapTime < 280 && Math.hypot(tx - lastTapX, ty - lastTapY) < 28) {
              if (e.target === mapStage || e.target.id === 'starMapSvg') {
                const oldS = state.camera.scale;
                const newS = Math.min(2.2, oldS * 1.45);
                const r = newS / oldS;
                animateCameraTo(tx - (tx - state.camera.tx) * r, ty - (ty - state.camera.ty) * r, newS, 400);
              }
              lastTapTime = 0;
            } else {
              lastTapTime = now;
              lastTapX = tx;
              lastTapY = ty;
            }
          }
          touchMode = null;
          setTimeout(() => { dragMoved = false; }, 30);
        } else if (e.touches.length === 1) {
          touchMode = 'pan';
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          camStartX = state.camera.tx;
          camStartY = state.camera.ty;
        }
      });

      mapStage.addEventListener('dblclick', (e) => {
        const oldScale = state.camera.scale;
        const targetScale = Math.max(0.18, Math.min(2.2, oldScale * 1.45));
        const ratio = targetScale / oldScale;
        const targetTx = e.clientX - (e.clientX - state.camera.tx) * ratio;
        const targetTy = e.clientY - (e.clientY - state.camera.ty) * ratio;
        animateCameraTo(targetTx, targetTy, targetScale, 420);
      });

      // 点击空白星空仅收起档案浮卡与搜索列表，绝不自动关闭「一」元标尺
      mapStage.addEventListener('click', () => {
        if (dragMoved) return;
        searchDropdown.classList.remove('open');
        if (detailDrawer.classList.contains('open') || state.selectedId) {
          closeDrawer();
        }
      });

      /* =====================================================================
         十二、星宿档案 · 悬浮星笺渲染与阅读态切换
         ===================================================================== */
      function setReadingState(isReading) {
        document.body.classList.toggle('card-reading', isReading);
        zoomCapsule.classList.toggle('drawer-shifted', isReading);
      }

      function selectNode(id, openDrawer = true, centerCamera = true) {
        const node = NODE_MAP[id];
        if (!node) return;
        state.selectedId = id;
        if (openDrawer) {
          renderDrawer(node);
          detailDrawer.classList.add('open');
          setReadingState(true);
        }
        updateVisuals();
        if (centerCamera) {
          requestAnimationFrame(() => {
            focusNodesSmooth([id], 0.92);
          });
        }
      }

      function closeDrawer() {
        state.selectedId = null;
        detailDrawer.classList.remove('open');
        setReadingState(false);
        updateVisuals();
      }

      function buildMiGridHtml(charId) {
        const data = DECOMPOSITIONS[charId];
        if (!data) return '';

        const strokesSvg = data.strokes.map((s, idx) => `
          <path
            d="${s.d}"
            stroke="${s.color}"
            stroke-width="${s.width}"
            data-sidx="${idx}"
            class="decomp-stroke"
          />
        `).join('');

        const tagsHtml = data.strokes.map((s, idx) => `
          <button type="button" class="decomp-tag" data-tidx="${idx}">
            <div class="decomp-tag-head">
              <span class="decomp-tag-dot" style="background:${s.color}; box-shadow:0 0 8px ${s.color}99;"></span>
              <span>${s.label}</span>
            </div>
            <div class="decomp-tag-desc">${s.desc}</div>
          </button>
        `).join('');

        return `
          <div class="migrid-card">
            <div class="migrid-header">
              <h3 class="section-label" style="margin:0;">
                <span class="section-label-dot" style="background:#f5c469;"></span>
                米字格笔意解构
              </h3>
              <span class="migrid-hint">悬停或点选高亮笔画</span>
            </div>
            <div class="migrid-layout">
              <div class="migrid-svg-wrap">
                <svg class="migrid-svg" viewBox="0 0 120 120">
                  <rect x="6" y="6" width="108" height="108" rx="6" fill="none" stroke="rgba(245,196,105,0.28)" stroke-width="1" />
                  <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" stroke-dasharray="3 3" />
                  <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" stroke-dasharray="3 3" />
                  <line x1="6" y1="6" x2="114" y2="114" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="3 4" />
                  <line x1="114" y1="6" x2="6" y2="114" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="3 4" />
                  ${strokesSvg}
                </svg>
              </div>
              <div class="migrid-tags">${tagsHtml}</div>
            </div>
          </div>
        `;
      }

      function buildMirrorHtml(charId) {
        const m = MIRRORS[charId];
        if (!m) return '';
        return `
          <div class="mirror-card">
            <h3 class="section-label" style="margin-bottom:8px;">
              <span class="section-label-dot" style="background:#c084fc;"></span>
              简繁双镜 · 一字两面
            </h3>
            <div class="mirror-grid">
              <div class="mirror-col">
                <div class="mirror-col-head">
                  <span class="mirror-char">${m.simpChar}</span>
                  <span class="mirror-kind">简体之象</span>
                </div>
                <p class="mirror-col-text">${m.simpText}</p>
              </div>
              <div class="mirror-col">
                <div class="mirror-col-head">
                  <span class="mirror-char">${m.tradChar}</span>
                  <span class="mirror-kind">繁体之魂</span>
                </div>
                <p class="mirror-col-text">${m.tradText}</p>
              </div>
            </div>
            <div class="mirror-synthesis">
              <strong style="color:#fde68a;">双镜合参：</strong>${m.synthesis}
            </div>
          </div>
        `;
      }

      function renderDrawer(node) {
        const accent = getNodeColor(node);
        const tint = getNodeTint(node);

        const relatedHtml = node.related.map(rid => {
          const rn = NODE_MAP[rid];
          if (!rn) return '';
          const rColor = getNodeColor(rn);
          return `
            <button class="related-chip" type="button" data-jump="${rid}">
              <span class="related-chip-glyph" style="color:${rColor};">${rn.id}</span>
              <span class="related-chip-note">${rn.note}</span>
            </button>
          `;
        }).join('');

        const tradSealBox = node.tradNote ? `
          <div class="relic-note-box">
            <span class="relic-mini-seal">繁</span>
            <span>${node.tradNote}</span>
          </div>
        ` : '';

        drawerContent.innerHTML = `
          <div class="drawer-hero">
            <div class="hero-glyph-box" style="background:${tint}; border:1.5px solid ${accent}88; color:${accent}; box-shadow:0 0 22px ${accent}24;">
              ${node.id}
              ${node.isTraditional ? '<span class="trad-seal-badge">繁</span>' : ''}
            </div>
            <div class="hero-info">
              <div class="hero-badges">
                <span class="hero-pinyin">${node.pinyin}</span>
                <span class="hero-note-pill">${node.note}</span>
                <span class="hero-domain-pill" style="color:${accent}; background:${tint}; border-color:${accent}55;">
                  ${node.realm}
                </span>
              </div>
              <h2 class="hero-essence">${node.tag}</h2>
            </div>
          </div>

          <div class="formula-box">
            <strong style="color:${accent};">字形脉络：</strong>${node.formula}
          </div>

          ${tradSealBox}
          ${buildMiGridHtml(node.id)}

          <div class="section-block">
            <h3 class="section-label">
              <span class="section-label-dot" style="background:${accent};"></span>
              构字隐喻
            </h3>
            <p class="section-text">${node.imagery}</p>
          </div>

          <div class="section-block">
            <h3 class="section-label">
              <span class="section-label-dot" style="background:${accent};"></span>
              系统定位
            </h3>
            <p class="section-text">${node.positioning}</p>
          </div>

          ${buildMirrorHtml(node.id)}

          <div class="practice-card">
            <div class="practice-title">✦ 观照自省</div>
            <p class="practice-quote">「${node.practice}」</p>
          </div>

          <div class="section-block" style="margin-bottom:4px;">
            <h3 class="section-label">
              <span class="section-label-dot" style="background:#f5c469;"></span>
              关联星宿
            </h3>
            <div class="related-chips">${relatedHtml}</div>
          </div>
        `;

        drawerContent.scrollTop = 0;

        // 米字格笔画交互高亮
        const strokes = drawerContent.querySelectorAll('.decomp-stroke');
        const tags = drawerContent.querySelectorAll('.decomp-tag');
        let pinnedIdx = null;

        function applyDecompHighlight(activeIdx) {
          strokes.forEach(st => {
            const idx = st.getAttribute('data-sidx');
            if (activeIdx === null) {
              st.style.opacity = '1';
              st.style.filter = 'none';
            } else if (idx === activeIdx) {
              st.style.opacity = '1';
              st.style.filter = 'drop-shadow(0 0 6px rgba(253, 230, 138, 0.9))';
            } else {
              st.style.opacity = '0.2';
              st.style.filter = 'none';
            }
          });
          tags.forEach(tg => {
            tg.classList.toggle('active', activeIdx !== null && tg.getAttribute('data-tidx') === activeIdx);
          });
        }

        tags.forEach(tg => {
          const idx = tg.getAttribute('data-tidx');
          tg.addEventListener('mouseenter', () => {
            if (pinnedIdx === null) applyDecompHighlight(idx);
          });
          tg.addEventListener('mouseleave', () => {
            if (pinnedIdx === null) applyDecompHighlight(null);
          });
          tg.addEventListener('click', () => {
            pinnedIdx = pinnedIdx === idx ? null : idx;
            applyDecompHighlight(pinnedIdx);
          });
        });

        strokes.forEach(st => {
          const idx = st.getAttribute('data-sidx');
          st.addEventListener('click', () => {
            pinnedIdx = pinnedIdx === idx ? null : idx;
            applyDecompHighlight(pinnedIdx);
          });
        });

        // 关联星宿飞掠跃迁 + 鎏金弧光
        drawerContent.querySelectorAll('[data-jump]').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-jump');
            if (state.tourActive) stopTour(false);
            if (state.jumpTimer) clearTimeout(state.jumpTimer);
            state.jumpArc = { from: node.id, to: targetId };
            state.jumpTimer = setTimeout(() => {
              state.jumpArc = null;
              updateVisuals();
            }, 1900);
            if (targetId === '一') triggerYiPulse();
            selectNode(targetId, true, true);
          });
        });
      }

      /* =====================================================================
         十三、顶部三联控制开关、底部星域筛选与寻字搜索
         ===================================================================== */
      starNotesBtn.addEventListener('click', () => {
        state.showStarNotes = !state.showStarNotes;
        starNotesBtn.classList.toggle('note-active', state.showStarNotes);
        starNotesBtn.classList.toggle('note-off', !state.showStarNotes);
        starNotesBtn.setAttribute('aria-pressed', String(state.showStarNotes));
        updateVisuals();
      });

      function setMetaRuler(active, animateFocus = true) {
        state.metaRulerActive = active;
        metaRulerBtn.classList.toggle('meta-active', active);
        metaRulerBtn.setAttribute('aria-pressed', String(active));
        metaBanner.classList.toggle('open', active);
        if (active) {
          if (state.tourActive) stopTour(false);
          closeDrawer();
          if (animateFocus) {
            focusNodesSmooth(Array.from(META_RULER_IDS), 0.72);
          }
        }
        updateVisuals();
      }

      metaRulerBtn.addEventListener('click', () => {
        setMetaRuler(!state.metaRulerActive, true);
      });
      closeMetaBannerBtn.addEventListener('click', () => {
        setMetaRuler(false, false);
      });

      function buildTourDots() {
        tourDots.innerHTML = '';
        TOUR_CHAPTERS.forEach((ch, idx) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'tour-dot';
          dot.setAttribute('aria-label', `第${ch.numeral}章`);
          dot.addEventListener('click', () => goToTourChapter(idx));
          tourDots.appendChild(dot);
        });
      }

      function goToTourChapter(index) {
        const clamped = Math.max(0, Math.min(TOUR_CHAPTERS.length - 1, index));
        state.tourIndex = clamped;
        const ch = TOUR_CHAPTERS[clamped];
        state.tourFocusSet = new Set(ch.focus);

        tourNumeral.textContent = ch.numeral;
        tourTitle.textContent = ch.title;
        tourBody.textContent = ch.body;
        tourPrevBtn.disabled = clamped === 0;
        tourNextBtn.textContent = clamped === TOUR_CHAPTERS.length - 1 ? '收束全览' : '下一章';

        tourDots.querySelectorAll('.tour-dot').forEach((d, idx) => {
          d.classList.toggle('active', idx === clamped);
        });

        if (window.innerWidth > 768 && ch.openId && NODE_MAP[ch.openId]) {
          state.selectedId = ch.openId;
          renderDrawer(NODE_MAP[ch.openId]);
          detailDrawer.classList.add('open');
          setReadingState(true);
        } else {
          state.selectedId = ch.openId || null;
          detailDrawer.classList.remove('open');
          setReadingState(false);
        }

        updateVisuals();
        if (ch.overview) {
          fitToViewport(true);
        } else {
          focusNodesSmooth(ch.focus, 0.92);
        }
      }

      function startTour() {
        if (state.metaRulerActive) setMetaRuler(false, false);
        state.activeFilter = 'all';
        refreshFilterPills();
        state.tourActive = true;
        tourBtn.classList.add('tour-active');
        tourBtn.setAttribute('aria-pressed', 'true');
        tourCard.classList.add('open');
        goToTourChapter(0);
      }

      function stopTour(resetView = false) {
        state.tourActive = false;
        state.tourFocusSet = null;
        if (state.metaRulerActive) setMetaRuler(false, false);
        tourBtn.classList.remove('tour-active');
        tourBtn.setAttribute('aria-pressed', 'false');
        tourCard.classList.remove('open');
        updateVisuals();
        if (resetView) {
          closeDrawer();
          fitToViewport(true);
        }
      }

      tourBtn.addEventListener('click', () => {
        if (state.tourActive) stopTour(true);
        else startTour();
      });
      tourPrevBtn.addEventListener('click', () => goToTourChapter(state.tourIndex - 1));
      tourNextBtn.addEventListener('click', () => {
        if (state.tourIndex >= TOUR_CHAPTERS.length - 1) stopTour(true);
        else goToTourChapter(state.tourIndex + 1);
      });
      tourExitBtn.addEventListener('click', () => stopTour(true));

      function initFilterBar() {
        filterScroll.innerHTML = '';
        FILTER_ITEMS.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-pill' + (item.id === state.activeFilter ? ' active' : '');
          btn.setAttribute('data-filter', item.id);
          btn.innerHTML = `<span class="filter-swatch" style="background:${item.color};"></span><span>${item.label}</span>`;
          btn.addEventListener('click', () => {
            if (state.tourActive) stopTour(false);
            state.activeFilter = item.id;
            refreshFilterPills();
            updateVisuals();

            if (item.id === 'all') {
              fitToViewport(true);
            } else {
              const matched = NODES.filter(n => nodeMatchesFilter(n)).map(n => n.id);
              if (matched.length) focusNodesSmooth(matched, 0.96);
            }
          });
          filterScroll.appendChild(btn);
        });
      }

      function refreshFilterPills() {
        filterScroll.querySelectorAll('.filter-pill').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-filter') === state.activeFilter);
        });
      }

      function renderSearchResults(raw) {
        const q = raw.trim().toLowerCase();
        searchClearBtn.classList.toggle('visible', q.length > 0);
        if (!q) {
          searchDropdown.classList.remove('open');
          return;
        }

        const matches = NODES.filter(n => {
          return (
            n.id.includes(q) ||
            n.note.toLowerCase().includes(q) ||
            n.pinyin.toLowerCase().includes(q) ||
            n.realm.toLowerCase().includes(q) ||
            n.tag.toLowerCase().includes(q) ||
            (MIRRORS[n.id] && MIRRORS[n.id].tradChar.includes(q))
          );
        });

        if (!matches.length) {
          searchDropdown.innerHTML = '<div class="search-empty">星海中未觅得对应字宿</div>';
        } else {
          searchDropdown.innerHTML = matches.slice(0, 12).map(n => {
            const c = getNodeColor(n);
            return `
              <button class="search-item" type="button" data-pick="${n.id}">
                <span class="search-item-glyph" style="color:${c}; border-color:${c}66; background:${getNodeTint(n)};">${n.id}</span>
                <span class="search-item-meta">
                  <span class="search-item-note">${n.note}</span>
                  <span class="search-item-domain">${n.realm}</span>
                </span>
              </button>
            `;
          }).join('');

          searchDropdown.querySelectorAll('[data-pick]').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-pick');
              if (state.tourActive) stopTour(false);
              state.activeFilter = 'all';
              refreshFilterPills();
              searchDropdown.classList.remove('open');
              searchInput.blur();
              if (id === '一') triggerYiPulse();
              selectNode(id, true, true);
            });
          });
        }
        searchDropdown.classList.add('open');
      }

      searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim()) renderSearchResults(searchInput.value);
      });
      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchClearBtn.classList.remove('visible');
        searchDropdown.classList.remove('open');
        searchInput.focus();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrap')) {
          searchDropdown.classList.remove('open');
        }
      });

      zoomInBtn.addEventListener('click', () => {
        const rect = getVisibleRect();
        zoomAtPoint(1.24, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      zoomOutBtn.addEventListener('click', () => {
        const rect = getVisibleRect();
        zoomAtPoint(0.8, rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
      resetViewBtn.addEventListener('click', () => {
        if (state.tourActive) stopTour(false);
        state.activeFilter = 'all';
        refreshFilterPills();
        updateVisuals();
        fitToViewport(true);
      });
      drawerCloseBtn.addEventListener('click', closeDrawer);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchDropdown.classList.remove('open');
          if (state.tourActive) stopTour(true);
          else if (detailDrawer.classList.contains('open')) closeDrawer();
        }
      });

      /* =====================================================================
         十四、启动初始化
         ===================================================================== */
      initStarfieldCanvas();
      buildStarMap();
      initFilterBar();
      buildTourDots();
      updateVisuals();
      fitToViewport(false);

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          state.fitScale = computeFitMetrics().scale;
          if (!state.selectedId && !state.tourActive && !state.metaRulerActive) {
            fitToViewport(true);
          } else {
            updateMarginaliaOpacity();
          }
        }, 160);
      });
    })();
  </script>
</body>
</html>
