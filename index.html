<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="汉字星图" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050914" />
  <title>一 · 十 · 木 · 米 · 汉字演化星图</title>
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" />
  <link id="faviconIcon" rel="icon" type="image/png" />
  <script>
    (function () {
      try {
        var c = document.createElement('canvas');
        c.width = 180;
        c.height = 180;
        var ctx = c.getContext('2d');
        if (!ctx) return;

        /* 纯净白底极轻珠光径向渐变 */
        var bg = ctx.createRadialGradient(90, 82, 10, 90, 90, 128);
        bg.addColorStop(0, '#ffffff');
        bg.addColorStop(0.62, '#fafbfd');
        bg.addColorStop(1, '#f4f5f8');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 180, 180);

        /* 暖鎏金渐变（白底清晰锐利） */
        var goldGrad = ctx.createLinearGradient(34, 26, 146, 154);
        goldGrad.addColorStop(0, '#dfa740');
        goldGrad.addColorStop(0.5, '#c48a24');
        goldGrad.addColorStop(1, '#9e6b14');

        /* 浅金细外环 */
        ctx.strokeStyle = 'rgba(196, 138, 36, 0.28)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(90, 90, 68, 0, Math.PI * 2);
        ctx.stroke();

        /* 四向纤细长芒 */
        ctx.save();
        ctx.shadowColor = 'rgba(158, 107, 20, 0.22)';
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 1.5;
        ctx.beginPath();
        ctx.moveTo(90, 26);
        ctx.lineTo(97.5, 82.5);
        ctx.lineTo(154, 90);
        ctx.lineTo(97.5, 97.5);
        ctx.lineTo(90, 154);
        ctx.lineTo(82.5, 97.5);
        ctx.lineTo(26, 90);
        ctx.lineTo(82.5, 82.5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(223, 167, 64, 0.22)';
        ctx.fill();
        ctx.strokeStyle = goldGrad;
        ctx.lineWidth = 3.0;
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();

        /* 四隅斜向短芒 */
        ctx.strokeStyle = goldGrad;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        var diag = [
          [46, 46, 73, 73],
          [134, 46, 107, 73],
          [46, 134, 73, 107],
          [134, 134, 107, 107]
        ];
        for (var i = 0; i < diag.length; i++) {
          ctx.beginPath();
          ctx.moveTo(diag[i][0], diag[i][1]);
          ctx.lineTo(diag[i][2], diag[i][3]);
          ctx.stroke();
        }

        /* 中心暖金微珠 */
        var pearlGrad = ctx.createRadialGradient(88, 88, 1, 90, 90, 7);
        pearlGrad.addColorStop(0, '#f3ca74');
        pearlGrad.addColorStop(0.55, '#c48a24');
        pearlGrad.addColorStop(1, '#9e6b14');
        ctx.fillStyle = pearlGrad;
        ctx.beginPath();
        ctx.arc(90, 90, 6.5, 0, Math.PI * 2);
        ctx.fill();

        var url = c.toDataURL('image/png');
        var appleLink = document.getElementById('appleTouchIcon');
        var favLink = document.getElementById('faviconIcon');
        if (appleLink) appleLink.href = url;
        if (favLink) favLink.href = url;
      } catch (e) {}
    })();
  </script>
  <style>
    /* =========================================================================
       一、全局深靛水墨星空色板与典雅字族（100% 纯内联 CSS，零外部依赖）
       ========================================================================= */
    :root {
      --bg-deep: #050914;
      --bg-mid: #0b1326;
      --panel-bg: rgba(8, 14, 28, 0.84);
      --panel-strong: rgba(7, 12, 24, 0.95);
      --border-soft: rgba(255, 255, 255, 0.12);
      --border-gold: rgba(245, 196, 105, 0.42);
      --text-main: #f4efe6;
      --text-sub: #b7c3d8;
      --text-muted: #7c89a3;

      /* 星域专属色板 */
      --c-core: #f5c469;       /* 演化主脉 · 鎏金 */
      --c-calib: #9fd8ea;      /* 知行校准 · 银青微光 */
      --c-wood: #4ade80;       /* 木系根基 · 翠玉青碧 */
      --c-wood-warn: #e07a5f;  /* 根系暗礁 · 赭橘 */
      --c-craft: #fbbf24;      /* 形态打磨 · 暖琥珀 */
      --c-delivery: #38bdf8;   /* 价值交付 · 天青碧 */
      --c-moat: #818cf8;       /* 长期壁垒 · 沉静蓝紫 */
      --c-shadow: #f43f5e;     /* 系统暗面 · 暗绛红 */
      --c-leap: #c084fc;       /* 高维化境 · 紫金冠冕 */
      --c-vermilion: #c23b2b;  /* 繁体遗珠 · 中国朱砂 */

      --font-serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      color-scheme: dark;
      background-color: #050914;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      background-color: #050914;
      background-image: radial-gradient(circle at 64% 44%, #111d38 0%, #0b1326 44%, #050914 100%);
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* 底层轻缓呼吸星尘微粒 Canvas */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 交互式星图 SVG 主舞台 */
    #mapStage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: grab;
      touch-action: none;
    }
    #mapStage.is-dragging {
      cursor: grabbing;
    }
    #mapSvg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================================================================
       二、星宿节点、星注、竖排淡墨边款与流光动效
       ========================================================================= */
    .star-node {
      cursor: pointer;
      transition: opacity 0.36s ease;
    }
    .star-node .node-body {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .star-node:hover .node-body {
      transform: scale(1.09);
    }

    .star-glyph {
      font-family: var(--font-serif);
      font-weight: 700;
      pointer-events: none;
    }

    .star-note-group {
      pointer-events: none;
      transition: opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1), transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .star-note-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .star-note-hidden {
      opacity: 0;
      transform: translateY(-4px);
    }
    .star-note-text {
      font-family: var(--font-sans);
      paint-order: stroke;
      stroke: rgba(5, 9, 20, 0.94);
      stroke-width: 3.4px;
      stroke-linejoin: round;
      transition: fill 0.28s ease;
    }

    /* 古星图竖排柔色边款（支持缩放呼吸联动 0.70 ↔ 0.50） */
    .domain-marginalia {
      pointer-events: none;
      transition: opacity 0.24s ease-out;
    }
    .marginalia-text {
      font-family: var(--font-serif);
      font-weight: 500;
      paint-order: stroke;
      stroke: rgba(5, 9, 20, 0.9);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    @keyframes axisPulseSweep {
      0% { stroke-dashoffset: 1650; opacity: 0; }
      14% { opacity: 0.96; }
      78% { opacity: 0.85; }
      100% { stroke-dashoffset: -1650; opacity: 0; }
    }
    .axis-pulse-path {
      stroke-dasharray: 240 1650;
      animation: axisPulseSweep 1.1s cubic-bezier(0.25, 0.8, 0.35, 1) forwards;
    }

    @keyframes flowDash {
      from { stroke-dashoffset: 36; }
      to { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: flowDash 2.6s linear infinite;
    }

    @keyframes metaFlow {
      from { stroke-dashoffset: 64; }
      to { stroke-dashoffset: 0; }
    }
    .meta-flow-line {
      stroke-dasharray: 10 6;
      animation: metaFlow 2.1s linear infinite;
    }

    @keyframes pulseAura {
      0%, 100% { opacity: 0.34; transform: scale(1); }
      50% { opacity: 0.68; transform: scale(1.05); }
    }
    .mi-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseAura 4.8s ease-in-out infinite;
    }

    @keyframes jumpArcFade {
      0% { opacity: 0.98; stroke-width: 3.4; }
      65% { opacity: 0.85; stroke-width: 2.6; }
      100% { opacity: 0; stroke-width: 1.4; }
    }
    .jump-arc-flash {
      animation: jumpArcFade 1.85s ease-out forwards;
    }

    @keyframes strokeGlowPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    .decomp-stroke {
      transition: opacity 0.22s ease, stroke-width 0.22s ease;
      cursor: pointer;
    }
    .decomp-stroke-active {
      animation: strokeGlowPulse 1.4s ease-in-out infinite;
    }

    /* =========================================================================
       三、顶部双行毛玻璃悬浮栏（桌面雅致紧凑，375px 手机窄屏零裁切）
       ========================================================================= */
    .top-header-shell {
      position: fixed;
      top: 14px;
      left: 20px;
      z-index: 32;
      width: min(500px, calc(100vw - 40px));
      padding: 9px 12px 10px;
      border-radius: 18px;
      background: linear-gradient(155deg, rgba(10, 17, 34, 0.86), rgba(6, 11, 24, 0.82));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(245, 196, 105, 0.22);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 第一行：星图题签（左八芒星芒 + 主标题，右淡雅宋体副标） */
    .header-row-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.075);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-star-svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(245, 196, 105, 0.45));
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #fdf6e7;
      white-space: nowrap;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-family: var(--font-serif);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      text-align: right;
      color: rgba(224, 214, 194, 0.62);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 第二行：零裁切控制栏（左无字小搜索框 + 右三联毛玻璃胶囊） */
    .header-row-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 60px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      width: 100%;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.13);
      transition: border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }
    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(245, 196, 105, 0.55);
      box-shadow: 0 0 14px rgba(245, 196, 105, 0.14);
    }

    .search-icon {
      width: 13px;
      height: 13px;
      color: #8f9db6;
      flex-shrink: 0;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 12.5px;
      width: 100%;
      min-width: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    .search-clear {
      display: none;
      background: none;
      border: none;
      color: #8f9db6;
      cursor: pointer;
      padding: 1px 2px;
      line-height: 1;
      font-size: 12px;
      flex-shrink: 0;
    }
    .search-clear.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .search-clear:hover {
      color: #fff;
    }

    /* 搜索候选下拉浮层 */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      width: 276px;
      max-height: 290px;
      overflow-y: auto;
      background: var(--panel-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 196, 105, 0.24);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.72);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 65;
    }
    .search-dropdown.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .search-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      transition: background 0.16s ease;
    }
    .search-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .search-item-glyph {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .search-item-meta {
      min-width: 0;
      flex: 1;
    }
    .search-item-top {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
    }
    .search-item-note {
      color: #f8e7c2;
      font-weight: 500;
    }
    .search-item-domain {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .search-item-tag {
      font-size: 11px;
      color: #8f9bb3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .search-empty {
      padding: 16px 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 三联毛玻璃胶囊按钮 */
    .control-capsules {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .capsule-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: #dce4f2;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.22s ease;
      font-family: var(--font-sans);
    }
    .capsule-btn:hover {
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(245, 196, 105, 0.45);
      color: #fef3d6;
    }
    .capsule-btn:active {
      transform: scale(0.96);
    }

    .capsule-btn.is-active {
      background: linear-gradient(135deg, rgba(245, 196, 105, 0.24), rgba(245, 196, 105, 0.09));
      border-color: rgba(245, 196, 105, 0.58);
      color: #fde8b4;
      box-shadow: 0 0 16px rgba(245, 196, 105, 0.18);
    }

    .capsule-btn.is-muted {
      color: #7d8ba3;
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #616f88;
      transition: all 0.24s ease;
      flex-shrink: 0;
    }
    .capsule-btn.is-active .status-dot {
      background: var(--c-core);
      box-shadow: 0 0 8px var(--c-core);
    }

    /* =========================================================================
       四、「一」元标尺诗意浮条（默认严格隐藏）
       ========================================================================= */
    .meta-banner {
      position: fixed;
      top: 112px;
      left: 20px;
      z-index: 28;
      max-width: min(500px, calc(100vw - 24px));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 16px;
      background: linear-gradient(125deg, rgba(13, 21, 42, 0.94), rgba(26, 20, 48, 0.94));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(245, 196, 105, 0.48);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.58), 0 0 22px rgba(245, 196, 105, 0.14);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .meta-banner.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .meta-banner-star {
      color: var(--c-core);
      font-size: 13px;
      flex-shrink: 0;
    }
    .meta-banner-text {
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #fdf2d6;
      line-height: 1.5;
    }
    .meta-banner-text .hl-gold {
      color: var(--c-core);
      font-weight: 700;
    }
    .meta-banner-text .hl-purple {
      color: var(--c-leap);
      font-weight: 700;
    }
    .meta-banner-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d6deec;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.18s ease;
    }
    .meta-banner-close:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    /* =========================================================================
       五、右侧独立竖向缩放胶囊
       ========================================================================= */
    .zoom-capsule {
      position: fixed;
      right: 20px;
      bottom: 84px;
      z-index: 26;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px;
      gap: 4px;
      border-radius: 999px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-soft);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.48);
      transition: right 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, filter 0.3s ease;
    }
    body.card-reading .zoom-capsule {
      opacity: 0.14;
      filter: blur(0.8px);
      pointer-events: none;
    }
    .zoom-capsule.drawer-shifted {
      right: 432px;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #dbe3f0;
      font-size: 17px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.14s ease;
      font-family: var(--font-sans);
    }
    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--c-core);
    }
    .zoom-btn:active {
      transform: scale(0.92);
    }
    .zoom-btn.reset-btn {
      font-size: 11px;
      letter-spacing: 0.04em;
      height: 34px;
      color: var(--text-sub);
    }
    .zoom-divider {
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* =========================================================================
       六、底部星域导航栏
       ========================================================================= */
    .filter-bar-wrap {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      max-width: calc(100vw - 40px);
      pointer-events: auto;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    body.card-reading .filter-bar-wrap {
      opacity: 0.14;
      filter: blur(0.8px);
      pointer-events: none;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-soft);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #a9b6cb;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }
    .filter-pill:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #f3efe6;
    }
    .filter-pill.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--pill-border, rgba(245, 196, 105, 0.5));
      color: #fff8ea;
      box-shadow: 0 0 14px var(--pill-glow, rgba(245, 196, 105, 0.16));
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* =========================================================================
       七、「壹至玖」九章漫游导览卡（默认严格隐藏）
       ========================================================================= */
    .tour-card {
      position: fixed;
      left: 20px;
      bottom: 84px;
      width: 360px;
      max-width: calc(100vw - 88px);
      z-index: 29;
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--panel-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 196, 105, 0.36);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.64);
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tour-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .tour-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tour-chapter-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tour-numeral {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(245, 196, 105, 0.16);
      border: 1px solid rgba(245, 196, 105, 0.45);
      color: var(--c-core);
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tour-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: #fdf4df;
      letter-spacing: 0.06em;
    }
    .tour-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #9aa7bd;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.18s ease;
    }
    .tour-close:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }
    .tour-body {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.72;
      color: #cbd5e6;
    }
    .tour-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tour-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tour-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.24s ease;
    }
    .tour-dot.active {
      width: 18px;
      background: var(--c-core);
    }
    .tour-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tour-nav-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #dce4f2;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: var(--font-sans);
    }
    .tour-nav-btn:hover:not(:disabled) {
      background: rgba(245, 196, 105, 0.18);
      border-color: rgba(245, 196, 105, 0.45);
      color: #fef2d2;
    }
    .tour-nav-btn:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }
    .tour-nav-btn.primary {
      background: rgba(245, 196, 105, 0.2);
      border-color: rgba(245, 196, 105, 0.5);
      color: #fde8b4;
    }

    /* =========================================================================
       八、星宿详情「悬浮星笺」（四边悬空圆角浮卡 + 居中极小星饰 + 内底缘柔光渐隐）
       ========================================================================= */
    .detail-drawer {
      position: fixed;
      top: 14px;
      right: 14px;
      bottom: 14px;
      width: 404px;
      max-width: calc(100vw - 28px);
      z-index: 45;
      border-radius: 22px;
      background: rgba(10, 14, 28, 0.94);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(245, 196, 105, 0.22);
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(108%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease;
    }
    .detail-drawer::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      background: linear-gradient(to bottom, rgba(10, 14, 28, 0) 0%, rgba(10, 14, 28, 0.96) 92%);
      border-radius: 0 0 22px 22px;
      pointer-events: none;
      z-index: 3;
    }
    .detail-drawer.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .drawer-handle-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 0 1px;
      flex-shrink: 0;
      cursor: default;
    }
    .drawer-star-ornament {
      font-family: var(--font-serif);
      font-size: 9px;
      letter-spacing: 0.48em;
      padding-left: 0.48em;
      color: rgba(245, 196, 105, 0.56);
      line-height: 1;
      user-select: none;
      text-shadow: 0 0 8px rgba(245, 196, 105, 0.28);
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 18px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.075);
      flex-shrink: 0;
    }
    .drawer-top-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--text-muted);
    }
    .drawer-close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e6;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }
    .drawer-close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 42px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      user-select: text;
      -webkit-user-select: text;
    }
    .drawer-scroll::-webkit-scrollbar,
    .search-dropdown::-webkit-scrollbar {
      width: 5px;
    }
    .drawer-scroll::-webkit-scrollbar-thumb,
    .search-dropdown::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .drawer-hero {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .hero-glyph-box {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .trad-seal-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 21px;
      height: 21px;
      border-radius: 4px;
      background: var(--c-vermilion);
      border: 1px solid #f4a498;
      color: #fff7ee;
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(194, 59, 43, 0.52);
    }
    .hero-info {
      min-width: 0;
      flex: 1;
    }
    .hero-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hero-pinyin {
      font-size: 13px;
      color: #dbe4f3;
      font-weight: 500;
    }
    .hero-note-pill {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fcebc4;
      letter-spacing: 0.06em;
    }
    .hero-domain-pill {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 500;
    }
    .hero-essence {
      margin: 7px 0 0;
      font-family: var(--font-serif);
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.45;
      color: #faf6ed;
    }

    .info-section {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .section-heading {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #d7e0ef;
    }
    .section-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .section-text {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.75;
      color: #b7c3d8;
    }

    .formula-box {
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 12.5px;
      color: #e9dec5;
      line-height: 1.6;
    }

    /* 观照自省金句卡 */
    .practice-card {
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(245, 196, 105, 0.28);
    }
    .practice-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }
    .practice-quote {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.7;
      color: #fef6e4;
    }

    /* 米字格交互笔画解构器 */
    .decomp-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(5, 10, 22, 0.76);
      border: 1px solid rgba(245, 196, 105, 0.22);
    }
    .decomp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .decomp-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #f5d899;
    }
    .decomp-hint {
      font-size: 10.5px;
      color: var(--text-muted);
    }
    .decomp-grid-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .decomp-svg-box {
      width: 112px;
      height: 112px;
      border-radius: 12px;
      background: rgba(13, 20, 38, 0.92);
      border: 1px solid rgba(245, 196, 105, 0.25);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .decomp-legend {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .decomp-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 5px 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .decomp-item:hover,
    .decomp-item.active {
      background: rgba(245, 196, 105, 0.12);
      border-color: rgba(245, 196, 105, 0.42);
    }
    .decomp-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .decomp-item-text {
      font-size: 11.5px;
      line-height: 1.45;
      color: #d6deed;
    }
    .decomp-item-text strong {
      color: #fef3d4;
      font-weight: 600;
    }

    /* 简繁双镜三栏对照卡 */
    .mirror-card {
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(155deg, rgba(24, 20, 44, 0.8), rgba(11, 17, 33, 0.88));
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .mirror-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .mirror-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #e4c6ff;
    }
    .mirror-pair {
      font-family: var(--font-serif);
      font-size: 13px;
      color: #f5c469;
      letter-spacing: 0.1em;
    }
    .mirror-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mirror-col {
      padding: 9px 10px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .mirror-col-head {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
    }
    .mirror-char {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: #fdf6e7;
    }
    .mirror-tag {
      font-size: 10px;
      color: #9ba8bf;
    }
    .mirror-desc {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.55;
      color: #b7c3d8;
    }
    .mirror-synth {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(245, 196, 105, 0.09);
      border-left: 2.5px solid var(--c-core);
      font-size: 12px;
      line-height: 1.6;
      color: #f6e7c5;
    }
    .mirror-synth-label {
      color: var(--c-core);
      font-weight: 600;
      margin-right: 4px;
    }

    /* 关联星宿标签 */
    .related-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .related-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e4eaf5;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: var(--font-sans);
    }
    .related-chip:hover {
      background: rgba(245, 196, 105, 0.16);
      border-color: rgba(245, 196, 105, 0.48);
      transform: translateY(-1px);
    }
    .related-chip-glyph {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
    }
    .related-chip-note {
      font-size: 11px;
      color: #9ba8bf;
    }

    /* =========================================================================
       九、桌面端悬停浮卡
       ========================================================================= */
    .hover-tooltip {
      position: fixed;
      z-index: 50;
      max-width: 244px;
      padding: 10px 13px;
      border-radius: 14px;
      background: rgba(7, 12, 25, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 196, 105, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.58);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }
    .hover-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .tt-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .tt-glyph {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }
    .tt-note {
      font-size: 12px;
      font-weight: 600;
      color: #fcebc4;
    }
    .tt-seal {
      font-family: var(--font-serif);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--c-vermilion);
      color: #fff7ee;
      display: none;
    }
    .tt-seal.show {
      display: inline-block;
    }
    .tt-tag {
      font-size: 11.5px;
      line-height: 1.5;
      color: #b4c0d6;
    }

    /* =========================================================================
       十、移动端响应式适配（严控 375px 窄屏第二行四项完整并排零裁切）
       ========================================================================= */
    @media (max-width: 820px) {
      .top-header-shell {
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 12px;
        right: 12px;
        width: auto;
        padding: 9px 11px 10px;
        border-radius: 16px;
        gap: 7px;
      }

      .meta-banner {
        top: calc(108px + env(safe-area-inset-top, 0px));
        left: 10px;
        right: 10px;
        max-width: none;
        padding: 8px 12px;
      }
      .meta-banner-text {
        font-size: 12px;
      }

      /* 移动端底部导航栏：贴底全宽单行平滑横滑 + 左右渐隐遮罩 */
      .filter-bar-wrap {
        bottom: 0;
        left: 0;
        right: 0;
        transform: none;
        max-width: 100%;
        background: linear-gradient(to top, rgba(5, 9, 20, 0.96) 66%, rgba(5, 9, 20, 0));
        padding: 8px 0 calc(10px + env(safe-area-inset-bottom, 0px));
      }
      .filter-bar {
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        background: rgba(8, 14, 28, 0.92);
        padding: 7px 14px;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 18px, #000 calc(100% - 18px), transparent 100%);
      }

      /* 移动端右侧独立竖向缩放胶囊（严格避开底部导航栏与安全区） */
      .zoom-capsule {
        right: 12px;
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      }
      .zoom-capsule.drawer-shifted {
        right: 12px;
      }
      .zoom-btn {
        width: 34px;
        height: 34px;
      }

      /* 移动端九章漫游卡 */
      .tour-card {
        left: 12px;
        right: 64px;
        width: auto;
        max-width: none;
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        padding: 13px 14px;
      }
      .tour-body {
        font-size: 12.5px;
        margin-bottom: 11px;
      }

      /* 移动端四边悬空「悬浮星笺」 */
      .detail-drawer {
        top: auto;
        left: 14px;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        width: auto;
        max-width: none;
        height: min(60vh, calc(100vh - 216px));
        max-height: 64vh;
        border-radius: 22px;
        border: 1px solid rgba(245, 196, 105, 0.24);
        box-shadow: 0 20px 54px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        transform: translateY(112%);
      }
      .detail-drawer.open {
        transform: translateY(0);
      }
      .drawer-handle-bar {
        display: flex;
        justify-content: center;
        padding: 8px 0 1px;
        cursor: grab;
        flex-shrink: 0;
      }
      .drawer-top {
        padding: 4px 16px 8px;
      }
      .drawer-scroll {
        padding: 14px 16px 40px;
        gap: 15px;
      }
      .hero-glyph-box {
        width: 60px;
        height: 60px;
