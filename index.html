      /* =======================================================================
         七、底层轻缓呼吸微尘星点 Canvas
         ======================================================================= */
      function initStarfieldCanvas() {
        try {
          const canvas = document.getElementById('bgCanvas');
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          let stars = [];
          let width = 0;
          let height = 0;

          function buildStars() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const count = Math.min(185, Math.max(88, Math.floor((width * height) / 10800)));
            stars = [];
            for (let i = 0; i < count; i++) {
              const pick = Math.random();
              let color = '224, 232, 246';
              if (pick > 0.82) color = '245, 196, 105';
              else if (pick > 0.68) color = '166, 218, 255';
              else if (pick > 0.58) color = '196, 160, 255';
              stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.4 + 0.35,
                baseAlpha: Math.random() * 0.44 + 0.12,
                speed: Math.random() * 0.0011 + 0.00032,
                phase: Math.random() * Math.PI * 2,
                color
              });
            }
          }

          function draw(ts) {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < stars.length; i++) {
              const s = stars[i];
              const alpha = s.baseAlpha + Math.sin(ts * s.speed + s.phase) * 0.18;
              ctx.fillStyle = `rgba(${s.color}, ${Math.max(0.04, Math.min(0.84, alpha))})`;
              ctx.beginPath();
              ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
              ctx.fill();
            }
            window.requestAnimationFrame(draw);
          }

          buildStars();
          window.addEventListener('resize', buildStars);
          window.requestAnimationFrame(draw);
        } catch (err) {
          console.error('Starfield initialization error:', err);
        }
      }

      /* =======================================================================
         八、构建 SVG 星图（柔和星云、演化主脉、星轨、元标尺、竖排边款、42 星宿）
         ======================================================================= */
      function buildStarMap() {
        const yi = NODE_MAP['一'];
        const shi = NODE_MAP['十'];
        const mu = NODE_MAP['木'];
        const mi = NODE_MAP['米'];

        // 1. 柔和径向星云晕染（纯净星象，无任何具象田字或插画装饰）
        auraLayer.appendChild(svgEl('circle', {
          cx: mi.x, cy: mi.y, r: 420,
          fill: 'url(#miSupernova)',
          class: 'mi-pulse'
        }));
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI) / 4;
          auraLayer.appendChild(svgEl('line', {
            x1: mi.x + Math.cos(angle) * 76,
            y1: mi.y + Math.sin(angle) * 76,
            x2: mi.x + Math.cos(angle) * 230,
            y2: mi.y + Math.sin(angle) * 230,
            stroke: '#f5c469',
            'stroke-width': 0.85,
            opacity: 0.13,
            'stroke-dasharray': '3 6'
          }));
        }

        auraLayer.appendChild(svgEl('circle', { cx: shi.x, cy: shi.y, r: 235, fill: 'url(#calibAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: mu.x, cy: mu.y, r: 350, fill: 'url(#woodAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: 1785, cy: 1015, r: 250, fill: 'url(#craftAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: 2275, cy: 695, r: 260, fill: 'url(#deliveryAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: 2135, cy: 345, r: 225, fill: 'url(#moatAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: 1765, cy: 1265, r: 210, fill: 'url(#shadowAura)' }));
        auraLayer.appendChild(svgEl('circle', { cx: 1645, cy: 295, r: 280, fill: 'url(#leapAura)' }));

        // 「十」垂直截流清光柱
        auraLayer.appendChild(svgEl('rect', {
          x: shi.x - 10.5, y: shi.y - 210, width: 21, height: 420, rx: 10.5,
          fill: 'url(#shiPillarGrad)',
          opacity: 0.56
        }));
        auraLayer.appendChild(svgEl('line', {
          x1: shi.x, y1: shi.y - 218, x2: shi.x, y2: shi.y + 218,
          stroke: '#f5c469', 'stroke-width': 1.05, opacity: 0.26, 'stroke-dasharray': '4 5'
        }));

        // 2. 演化主脉流光弧：纯净收束于星核「米」（一 → 十 → 木 → 米）
        const mainPaths = [
          { d: `M ${yi.x} ${yi.y} L ${shi.x} ${shi.y}`, w: 3.2, op: 0.78, stroke: 'url(#yiBeamGrad)' },
          { d: 'M 485 935 Q 748 830 1015 785', w: 3.6, op: 0.82, stroke: 'url(#mainAxisGrad)' },
          { d: 'M 1015 785 Q 1366 694 1725 650', w: 4.0, op: 0.9, stroke: 'url(#mainAxisGrad)' }
        ];
        mainPaths.forEach(p => {
          mainAxisLayer.appendChild(svgEl('path', {
            d: p.d, fill: 'none', stroke: p.stroke,
            'stroke-width': p.w + 4, opacity: p.op * 0.22, 'stroke-linecap': 'round'
          }));
          mainAxisLayer.appendChild(svgEl('path', {
            d: p.d, fill: 'none', stroke: p.stroke,
            'stroke-width': p.w, opacity: p.op, 'stroke-linecap': 'round', filter: 'url(#glowSoft)'
          }));
          mainAxisLayer.appendChild(svgEl('path', {
            d: p.d, fill: 'none', stroke: '#fff6dd',
            'stroke-width': 1.4, opacity: p.op * 0.85, class: 'flow-line'
          }));
        });

        // 3. 静态星轨细线
        const satelliteEdges = [
          ['十', '士'], ['十', '土'], ['十', '干'], ['十', '千'],
          ['木', '本'], ['木', '末'], ['木', '未'], ['木', '休'],
          ['木', '林'], ['林', '森'], ['木', '樂'], ['休', '樂'],
          ['木', '困'], ['木', '呆'], ['木', '枯'], ['木', '鬱'], ['困', '枯'],
          ['米', '粗'], ['粗', '粒'], ['粒', '料'], ['料', '精'], ['精', '粹'], ['米', '精'],
          ['米', '粥'], ['粥', '粉'], ['粉', '糖'], ['糖', '粘'], ['粘', '糰'], ['米', '粘'], ['粥', '糖'],
          ['米', '粮'], ['粮', '奥'], ['奥', '断'], ['断', '继'], ['米', '继'], ['粮', '继'],
          ['米', '迷'], ['迷', '糟'], ['糟', '粕'], ['米', '糟'],
          ['米', '来'], ['米', '番'], ['米', '氣'], ['米', '类'], ['来', '番'], ['来', '氣'], ['番', '类']
        ];

        satelliteEdges.forEach(([fromId, toId]) => {
          const a = NODE_MAP[fromId];
          const b = NODE_MAP[toId];
          if (!a || !b) return;
          const color = getNodeColor(b);
          const mx = (a.x + b.x) / 2;
          const my = (a.y + b.y) / 2;
          const cx = mx - (b.y - a.y) * 0.08;
          const cy = my + (b.x - a.x) * 0.08;
          staticEdgesLayer.appendChild(svgEl('path', {
            d: `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`,
            fill: 'none',
            stroke: color,
            'stroke-width': 1.15,
            opacity: 0.22,
            'data-from': fromId,
            'data-to': toId,
            class: 'static-edge'
          }));
        });

        // 4. 七星「一」元标尺流动铂金星轨（一 → 士·土·干 → 本·末 → 来）
        const metaPairs = [
          ['一', '士', -0.18],
          ['一', '土', 0.16],
          ['一', '干', -0.1],
          ['士', '末', -0.14],
          ['土', '本', 0.12],
          ['干', '本', 0.06],
          ['本', '末', -0.16],
          ['末', '来', -0.18],
          ['本', '来', 0.14]
        ];
        metaPairs.forEach(([fromId, toId, bend]) => {
          const a = NODE_MAP[fromId];
          const b = NODE_MAP[toId];
          if (!a || !b) return;
          const mx = (a.x + b.x) / 2;
          const my = (a.y + b.y) / 2;
          const cx = mx - (b.y - a.y) * bend;
          const cy = my + (b.x - a.x) * bend;
          const d = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
          metaRulerLayer.appendChild(svgEl('path', {
            d, fill: 'none', stroke: 'url(#metaRulerGrad)',
            'stroke-width': 3.2, opacity: 0.28, filter: 'url(#glowGold)'
          }));
          metaRulerLayer.appendChild(svgEl('path', {
            d, fill: 'none', stroke: 'url(#metaRulerGrad)',
            'stroke-width': 1.8, opacity: 0.94, class: 'meta-flow-line'
          }));
        });

        // 5. 七大外绕星域：古星图「竖排淡墨边款」（逐字竖排宋体 + 纤细引首）
        Object.values(DOMAINS).forEach(dom => {
          if (!dom.marginalia) return;
          const m = dom.marginalia;
          const mg = svgEl('g', {
            transform: `translate(${m.x}, ${m.y})`,
            opacity: 0.70,
            'data-domain-marginalia': dom.id,
            class: 'domain-marginalia'
          });

          mg.appendChild(svgEl('circle', {
            cx: 0, cy: -24, r: 1.8,
            fill: m.tint, opacity: 0.9
          }));
          mg.appendChild(svgEl('line', {
            x1: 0, y1: -19, x2: 0, y2: -6,
            stroke: m.tint, 'stroke-width': 0.9, 'stroke-linecap': 'round', opacity: 0.75
          }));

          const textEl = svgEl('text', {
            x: 0, y: 9,
            'text-anchor': 'middle',
            fill: m.tint,
            'font-size': 16,
            class: 'marginalia-text'
          });
          Array.from(m.text).forEach((ch, idx) => {
            const tspan = svgEl('tspan', { x: 0, dy: idx === 0 ? '0' : '23' });
            tspan.textContent = ch;
            textEl.appendChild(tspan);
          });
          mg.appendChild(textEl);
          marginaliaLayer.appendChild(mg);
        });

        // 6. 渲染全部 42 颗星宿节点
        NODES.forEach(node => {
          const accent = getNodeColor(node);
          const isCore = node.domain === 'core';
          const isMi = node.id === '米';
          const isMeta = META_RULER_SET.has(node.id);
          const isTrad = TRADITIONAL_SET.has(node.id);

          const g = svgEl('g', {
            transform: `translate(${node.x}, ${node.y})`,
            class: 'star-node',
            'data-id': node.id,
            'data-domain': node.domain
          });

          const bodyG = svgEl('g', { class: 'node-body' });

          // 选中外虚光环
          bodyG.appendChild(svgEl('circle', {
            cx: 0, cy: 0, r: node.r + 10,
            fill: 'none', stroke: accent,
            'stroke-width': 2.1, 'stroke-dasharray': '5 4',
            opacity: 0, filter: 'url(#glowSoft)',
            class: 'selected-ring'
          }));

          // 七星元标尺铂金外环
          if (isMeta) {
            bodyG.appendChild(svgEl('circle', {
              cx: 0, cy: 0, r: node.r + 14,
              fill: 'none', stroke: '#fef0c7',
              'stroke-width': 1.8, opacity: 0,
              filter: 'url(#glowGold)',
              class: 'meta-ring'
            }));
          }

          // 柔和星晕
          bodyG.appendChild(svgEl('circle', {
            cx: 0, cy: 0, r: node.r + (isMi ? 8 : 4),
            fill: accent,
            opacity: isMi ? 0.19 : (isCore ? 0.14 : 0.08)
          }));

          // 深靛实底圆盘
          bodyG.appendChild(svgEl('circle', {
            cx: 0, cy: 0, r: node.r,
            fill: isMi ? '#151c33' : (isCore ? '#10182d' : '#0b1224'),
            stroke: accent,
            'stroke-width': isMi ? 2.8 : (isCore ? 2.2 : 1.5),
            filter: isCore ? 'url(#glowSoft)' : ''
          }));

          // 主脉与「来」冠冕细内环
          if (isCore || node.id === '来') {
            bodyG.appendChild(svgEl('circle', {
              cx: 0, cy: 0, r: node.r - 5,
              fill: 'none', stroke: accent,
              'stroke-width': 0.7, opacity: 0.42
            }));
          }

          // 汉字本体（居中宋体）
          const glyph = svgEl('text', {
            x: 0, y: 1,
            'text-anchor': 'middle',
            'dominant-baseline': 'central',
            fill: isCore ? '#fff6e0' : '#f4efe6',
            'font-size': isMi ? 38 : (isCore ? Math.round(node.r * 0.78) : Math.round(node.r * 0.86)),
            class: 'star-glyph'
          });
          glyph.textContent = node.id;
          bodyG.appendChild(glyph);

          // 仅四枚繁体遗珠（樂、鬱、糰、氣）右上角附极小朱砂方印「繁」
          if (isTrad) {
            const sx = node.r * 0.56;
            const sy = -node.r * 0.96;
            const sealG = svgEl('g', {
              transform: `translate(${sx}, ${sy})`,
              style: 'pointer-events: none;'
            });
            sealG.appendChild(svgEl('rect', {
              x: 0, y: 0, width: 15.5, height: 15.5, rx: 2.4,
              fill: '#c23b2b', stroke: '#f4a498', 'stroke-width': 0.75
            }));
            const sealTxt = svgEl('text', {
              x: 7.75, y: 8.2,
              'text-anchor': 'middle',
              'dominant-baseline': 'central',
              fill: '#fff7ee',
              'font-size': 9.2,
              class: 'star-glyph'
            });
            sealTxt.textContent = '繁';
            sealG.appendChild(sealTxt);
            bodyG.appendChild(sealG);
          }

          g.appendChild(bodyG);

          // 全部 42 星宿意象星注统一排布在圆环正下方（绝不在上方挂字）
          const noteY = node.r + (isMi ? 22 : (isCore ? 19 : 16));
          const noteG = svgEl('g', { class: 'star-note-group star-note-visible' });
          const noteTxt = svgEl('text', {
            x: 0, y: noteY,
            'text-anchor': 'middle',
            'dominant-baseline': 'central',
            fill: isCore ? 'rgba(249, 232, 196, 0.88)' : 'rgba(222, 224, 232, 0.74)',
            'font-size': isMi ? 13 : (isCore ? 12 : 11),
            'letter-spacing': '0.11em',
            class: 'star-note-text'
          });
          noteTxt.textContent = node.note;
          noteG.appendChild(noteTxt);
          g.appendChild(noteG);

          // 节点交互
          g.addEventListener('mouseenter', (e) => {
            state.hoveredId = node.id;
            showTooltip(node, e);
            updateVisuals();
          });
          g.addEventListener('mousemove', (e) => moveTooltip(e));
          g.addEventListener('mouseleave', () => {
            if (state.hoveredId === node.id) state.hoveredId = null;
            hideTooltip();
            updateVisuals();
          });
          g.addEventListener('click', (e) => {
            e.stopPropagation();
            if (dragMoved) return;
            if (state.tourActive) stopTour(false);
            if (node.id === '一') {
              triggerMainAxisPulse();
              selectNode('一', true, true);
              return;
            }
            if (state.metaRulerActive && !META_RULER_SET.has(node.id)) {
              state.metaRulerActive = false;
            }
            selectNode(node.id, true);
          });
          g.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            focusNodesSmooth([node.id], 1.12);
          });

          nodesLayer.appendChild(g);
        });
      }

      /* =======================================================================
         九、全局视觉状态同步（星注、竖排淡墨边款、筛选、元标尺与跃迁弧线）
         ======================================================================= */
      function nodeMatchesFilter(node) {
        if (state.activeFilter === 'all') return true;
        return node.domain === state.activeFilter;
      }

      function updateVisuals() {
        // 顶部三联按钮状态
        starNoteBtn.classList.toggle('is-active', state.showStarNotes);
        starNoteBtn.classList.toggle('is-muted', !state.showStarNotes);
        starNoteBtn.setAttribute('aria-pressed', String(state.showStarNotes));

        metaRulerBtn.classList.toggle('is-active', state.metaRulerActive);
        metaRulerBtn.setAttribute('aria-pressed', String(state.metaRulerActive));
        metaBanner.classList.toggle('visible', state.metaRulerActive);
        metaRulerLayer.setAttribute('opacity', state.metaRulerActive ? '1' : '0');

        tourBtn.classList.toggle('is-active', state.tourActive);
        tourBtn.setAttribute('aria-pressed', String(state.tourActive));

        const focusId = state.hoveredId || state.selectedId;
        const focusNode = focusId ? NODE_MAP[focusId] : null;
        const relatedSet = focusNode ? new Set([focusNode.id, ...focusNode.related]) : null;

        // 1. 同步 42 颗星宿与下方星注
        nodesLayer.querySelectorAll('.star-node').forEach(g => {
          const id = g.getAttribute('data-id');
          const node = NODE_MAP[id];
          const selRing = g.querySelector('.selected-ring');
          const metaRing = g.querySelector('.meta-ring');
          const noteG = g.querySelector('.star-note-group');
          const noteTxt = g.querySelector('.star-note-text');

          const isSelected = id === state.selectedId || (state.tourFocusSet && state.tourFocusSet.has(id));
          selRing.setAttribute('opacity', isSelected ? '0.94' : '0');
          if (metaRing) {
            metaRing.setAttribute('opacity', state.metaRulerActive ? '0.95' : '0');
          }

          let opacity = 1;
          if (state.metaRulerActive) {
            opacity = META_RULER_SET.has(id) ? 1 : 0.16;
          } else if (state.tourActive && state.tourFocusSet) {
            opacity = state.tourFocusSet.has(id) ? 1 : 0.22;
          } else if (state.activeFilter !== 'all') {
            opacity = nodeMatchesFilter(node) ? 1 : 0.16;
          } else if (relatedSet) {
            opacity = relatedSet.has(id) ? 1 : 0.34;
          }
          g.style.opacity = String(opacity);

          // 关闭「星注」进入纯净赏星态时，悬停、选中、漫游聚焦或元标尺点亮的星宿仍以暖金柔光临时浮现星注
          const isTempReveal =
            id === state.hoveredId ||
            id === state.selectedId ||
            (state.tourActive && state.tourFocusSet && state.tourFocusSet.has(id)) ||
            (state.metaRulerActive && META_RULER_SET.has(id));
          const showNote = state.showStarNotes || isTempReveal;

          if (noteG && noteTxt) {
            noteG.classList.toggle('star-note-visible', showNote);
            noteG.classList.toggle('star-note-hidden', !showNote);
            if (!state.showStarNotes && isTempReveal) {
              noteTxt.setAttribute('fill', '#fde68a');
            } else {
              noteTxt.setAttribute(
                'fill',
                node.domain === 'core' ? 'rgba(249, 232, 196, 0.88)' : 'rgba(222, 224, 232, 0.74)'
              );
            }
          }
        });

        // 2. 同步静态星轨透明度
        staticEdgesLayer.querySelectorAll('.static-edge').forEach(edge => {
          const from = edge.getAttribute('data-from');
          const to = edge.getAttribute('data-to');
          if (state.metaRulerActive) {
            edge.setAttribute('opacity', '0.05');
          } else if (state.tourActive && state.tourFocusSet) {
            const lit = state.tourFocusSet.has(from) && state.tourFocusSet.has(to);
            edge.setAttribute('opacity', lit ? '0.46' : '0.06');
          } else if (state.activeFilter !== 'all') {
            const lit = nodeMatchesFilter(NODE_MAP[from]) && nodeMatchesFilter(NODE_MAP[to]);
            edge.setAttribute('opacity', lit ? '0.44' : '0.06');
          } else if (focusNode) {
            const lit = from === focusNode.id || to === focusNode.id;
            edge.setAttribute('opacity', lit ? '0.52' : '0.1');
          } else {
            edge.setAttribute('opacity', '0.22');
          }
        });

        mainAxisLayer.style.opacity = state.metaRulerActive ? '0.24' : '1';

        // 3. 同步七大外绕星域「竖排柔色边款」（0.70 ↔ 0.50 缩放呼吸联动）
        updateMarginaliaBreathing();

        // 4. 动态关联流光弧与跃迁金弧
        dynamicLinksLayer.innerHTML = '';
        if (focusNode && !state.metaRulerActive) {
          const accent = getNodeColor(focusNode);
          focusNode.related.forEach(targetId => {
            const target = NODE_MAP[targetId];
            if (!target) return;
            const mx = (focusNode.x + target.x) / 2;
            const my = (focusNode.y + target.y) / 2;
            const cx = mx - (target.y - focusNode.y) * 0.14;
            const cy = my + (target.x - focusNode.x) * 0.14;
            dynamicLinksLayer.appendChild(svgEl('path', {
              d: `M ${focusNode.x} ${focusNode.y} Q ${cx} ${cy} ${target.x} ${target.y}`,
              fill: 'none',
              stroke: accent,
              'stroke-width': 1.8,
              opacity: 0.78,
              filter: 'url(#glowSoft)',
              class: 'flow-line',
              style: 'pointer-events: none;'
            }));
          });
        }

        if (state.jumpArc) {
          const a = NODE_MAP[state.jumpArc.from];
          const b = NODE_MAP[state.jumpArc.to];
          if (a && b) {
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;
            const cx = mx - (b.y - a.y) * 0.18;
            const cy = my + (b.x - a.x) * 0.18;
            dynamicLinksLayer.appendChild(svgEl('path', {
              d: `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`,
              fill: 'none',
              stroke: '#fef08a',
              'stroke-width': 3.2,
              'stroke-linecap': 'round',
              filter: 'url(#glowGold)',
              class: 'jump-arc-flash',
              style: 'pointer-events: none;'
            }));
          }
        }
      }

      /* =======================================================================
         十、画布相机操控（平移、滚轮定点缩放、双指捏合、双击聚焦与自适应全览）
         ======================================================================= */
      let axisPulseTimer = null;
      function triggerMainAxisPulse() {
        if (!axisPulseLayer) return;
        const yi = NODE_MAP['一'];
        const shi = NODE_MAP['十'];
        axisPulseLayer.innerHTML = '';
        const fullAxisD = `M ${yi.x} ${yi.y} L ${shi.x} ${shi.y} Q 748 830 1015 785 Q 1366 694 1725 650`;
        axisPulseLayer.appendChild(svgEl('path', {
          d: fullAxisD,
          fill: 'none',
          stroke: '#fff3c4',
          'stroke-width': 4.2,
          'stroke-linecap': 'round',
          filter: 'url(#glowGold)',
          class: 'axis-pulse-path'
        }));
        if (axisPulseTimer) clearTimeout(axisPulseTimer);
        axisPulseTimer = setTimeout(() => {
          axisPulseLayer.innerHTML = '';
        }, 1150);
      }

      function getOverviewScale() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const isDesktop = vw > 820;
        const leftPad = isDesktop ? 32 : 12;
        const rightPad = isDesktop ? 72 : 12;
        const headerEl = document.querySelector('.top-header-shell');
        const headerBottom = headerEl ? Math.ceil(headerEl.getBoundingClientRect().bottom) + 12 : (isDesktop ? 114 : 116);
        const topPad = Math.max(isDesktop ? 114 : 112, headerBottom);
        const filterEl = document.querySelector('.filter-bar-wrap');
        const filterSpace = filterEl ? Math.ceil(vh - filterEl.getBoundingClientRect().top) + 12 : (isDesktop ? 86 : 96);
        const bottomPad = Math.max(isDesktop ? 86 : 84, filterSpace);
        const w = Math.max(220, vw - leftPad - rightPad);
        const h = Math.max(220, vh - topPad - bottomPad);
        return Math.max(0.16, Math.min(1.15, Math.min(w / (2545 - 110), h / (1390 - 95)) * 0.96));
      }

      function updateMarginaliaBreathing() {
        const baseScale = Math.max(0.16, getOverviewScale());
        const relZoom = state.camera.scale / baseScale;
        /* 全览俯瞰 0.70，放大细读平滑淡退至 0.50 */
        const t = Math.max(0, Math.min(1, (relZoom - 1.05) / 0.95));
        const breathOp = 0.70 - t * (0.70 - 0.50);

        marginaliaLayer.querySelectorAll('.domain-marginalia').forEach(mg => {
          const domId = mg.getAttribute('data-domain-marginalia');
          let targetOp = breathOp;

          if (!state.showStarNotes) {
            targetOp = 0;
          } else if (state.metaRulerActive) {
            targetOp = 0.08;
          } else if (state.activeFilter !== 'all') {
            if (state.activeFilter === 'core') {
              targetOp = 0.08;
            } else {
              targetOp = domId === state.activeFilter ? Math.min(0.82, breathOp + 0.12) : 0.08;
            }
          } else if (state.tourActive && state.tourFocusSet) {
            let domInTour = false;
            state.tourFocusSet.forEach(fid => {
              if (NODE_MAP[fid] && NODE_MAP[fid].domain === domId) domInTour = true;
            });
            targetOp = domInTour ? Math.min(0.76, breathOp + 0.06) : 0.10;
          } else {
            targetOp = breathOp;
          }

          mg.style.opacity = targetOp.toFixed(3);
        });
      }

      function applyCamera() {
        viewportGroup.setAttribute(
          'transform',
          `translate(${state.camera.tx.toFixed(2)}, ${state.camera.ty.toFixed(2)}) scale(${state.camera.scale.toFixed(4)})`
        );
        updateMarginaliaBreathing();
      }

      function animateCameraTo(targetTx, targetTy, targetScale, duration = 560) {
        if (state.animId) window.cancelAnimationFrame(state.animId);
        const startTx = state.camera.tx;
        const startTy = state.camera.ty;
        const startScale = state.camera.scale;
        const startTime = performance.now();

        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          state.camera.tx = startTx + (targetTx - startTx) * ease;
          state.camera.ty = startTy + (targetTy - startTy) * ease;
          state.camera.scale = startScale + (targetScale - startScale) * ease;
          applyCamera();
          if (t < 1) {
            state.animId = window.requestAnimationFrame(step);
          } else {
            state.animId = null;
          }
        }
        state.animId = window.requestAnimationFrame(step);
      }

      function getVisibleRect(forSingleNode = false) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const isDesktop = vw > 820;
        const drawerOpen = detailDrawer.classList.contains('open');
        const leftPad = isDesktop ? 32 : 12;
        const rightPad = isDesktop ? (drawerOpen ? 440 : 72) : 12;
        const headerEl = document.querySelector('.top-header-shell');
        const headerBottom = headerEl ? Math.ceil(headerEl.getBoundingClientRect().bottom) + 12 : (isDesktop ? 114 : 116);
        const topPad = Math.max(isDesktop ? 114 : 112, headerBottom);
        const filterEl = document.querySelector('.filter-bar-wrap');
        const filterSpace = filterEl ? Math.ceil(vh - filterEl.getBoundingClientRect().top) + 12 : (isDesktop ? 86 : 96);
        let bottomPad = Math.max(isDesktop ? 86 : 84, filterSpace);
        if (!isDesktop && drawerOpen && forSingleNode) {
          const cardH = detailDrawer.offsetHeight || Math.min(vh * 0.60, vh - 216);
          bottomPad = cardH + 22;
        }
        return {
          left: leftPad,
          top: topPad,
          width: Math.max(220, vw - leftPad - rightPad),
          height: Math.max(110, vh - topPad - bottomPad)
        };
      }

      function fitToViewport(animated = true) {
        const rect = getVisibleRect();
        const minX = 110, maxX = 2545, minY = 95, maxY = 1390;
        const boxW = maxX - minX;
        const boxH = maxY - minY;
        const scale = Math.max(0.16, Math.min(1.15, Math.min(rect.width / boxW, rect.height / boxH) * 0.96));
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const isPortrait = window.innerHeight > window.innerWidth;
        const verticalAnchor = isPortrait ? 0.43 : 0.48;
        const tx = rect.left + rect.width / 2 - cx * scale;
        const ty = rect.top + rect.height * verticalAnchor - cy * scale;

        if (animated) {
          animateCameraTo(tx, ty, scale, 600);
        } else {
          state.camera = { tx, ty, scale };
          applyCamera();
        }
      }

      function focusNodesSmooth(ids, desiredScale = null) {
        const pts = ids.map(id => NODE_MAP[id]).filter(Boolean);
        if (!pts.length) return;
        const rect = getVisibleRect(pts.length === 1);

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pts.forEach(p => {
          minX = Math.min(minX, p.x - p.r - 48);
          maxX = Math.max(maxX, p.x + p.r + 48);
          minY = Math.min(minY, p.y - p.r - 48);
          maxY = Math.max(maxY, p.y + p.r + 60);
        });

        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        let scale;
        if (pts.length === 1) {
          scale = desiredScale || Math.max(state.camera.scale, window.innerWidth <= 820 ? 0.78 : 0.92);
          scale = Math.min(1.35, Math.max(0.55, scale));
        } else {
          const fitScale = Math.min(rect.width / Math.max(260, maxX - minX), rect.height / Math.max(220, maxY - minY)) * 0.88;
          scale = desiredScale ? Math.min(desiredScale, fitScale) : fitScale;
          scale = Math.min(1.25, Math.max(0.28, scale));
        }

        const tx = rect.left + rect.width / 2 - cx * scale;
        const ty = rect.top + rect.height / 2 - cy * scale;
        animateCameraTo(tx, ty, scale, 560);
      }

      function zoomAtPoint(factor, screenX, screenY) {
        if (state.animId) {
          window.cancelAnimationFrame(state.animId);
          state.animId = null;
        }
        const oldScale = state.camera.scale;
        const newScale = Math.max(0.18, Math.min(2.4, oldScale * factor));
        const ratio = newScale / oldScale;
        state.camera.tx = screenX - (screenX - state.camera.tx) * ratio;
        state.camera.ty = screenY - (screenY - state.camera.ty) * ratio;
        state.camera.scale = newScale;
        applyCamera();
      }

      let isPointerDown = false;
      let dragMoved = false;
      let lastX = 0;
      let lastY = 0;
      const activePointers = new Map();
      let lastPinchDist = null;
      let lastPinchCenter = null;

      function getPinchMetrics() {
        const pts = Array.from(activePointers.values());
        return {
          dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
          cx: (pts[0].x + pts[1].x) / 2,
          cy: (pts[0].y + pts[1].y) / 2
        };
      }

      mapStage.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { mapStage.setPointerCapture(e.pointerId); } catch (_) {}

        if (activePointers.size === 1) {
          isPointerDown = true;
          dragMoved = false;
          lastX = e.clientX;
          lastY = e.clientY;
          mapStage.classList.add('is-dragging');
        } else if (activePointers.size === 2) {
          isPointerDown = false;
          dragMoved = true;
          const m = getPinchMetrics();
          lastPinchDist = m.dist;
          lastPinchCenter = { x: m.cx, y: m.cy };
        }
      });

      mapStage.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2 && lastPinchDist) {
          const m = getPinchMetrics();
          const factor = m.dist / Math.max(10, lastPinchDist);
          state.camera.tx += m.cx - lastPinchCenter.x;
          state.camera.ty += m.cy - lastPinchCenter.y;
          zoomAtPoint(factor, m.cx, m.cy);
          lastPinchDist = m.dist;
          lastPinchCenter = { x: m.cx, y: m.cy };
          return;
        }

        if (isPointerDown && activePointers.size === 1) {
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          if (Math.hypot(dx, dy) > 3) dragMoved = true;
          if (dragMoved) {
            if (state.animId) {
              window.cancelAnimationFrame(state.animId);
              state.animId = null;
            }
            state.camera.tx += dx;
            state.camera.ty += dy;
            applyCamera();
            lastX = e.clientX;
            lastY = e.clientY;
          }
        }
      });

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          lastPinchDist = null;
          lastPinchCenter = null;
        }
        if (activePointers.size === 0) {
          isPointerDown = false;
          mapStage.classList.remove('is-dragging');
          setTimeout(() => { dragMoved = false; }, 40);
        } else if (activePointers.size === 1) {
          const remain = Array.from(activePointers.values())[0];
          isPointerDown = true;
          lastX = remain.x;
          lastY = remain.y;
        }
      }

      mapStage.addEventListener('pointerup', endPointer);
      mapStage.addEventListener('pointercancel', endPointer);

      mapStage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.89;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      mapStage.addEventListener('click', () => {
        if (dragMoved) return;
        closeDrawer();
      });

      zoomInBtn.addEventListener('click', () => {
        const r = getVisibleRect();
        zoomAtPoint(1.24, r.left + r.width / 2, r.top + r.height / 2);
      });
      zoomOutBtn.addEventListener('click', () => {
        const r = getVisibleRect();
        zoomAtPoint(0.8, r.left + r.width / 2, r.top + r.height / 2);
      });
      zoomResetBtn.addEventListener('click', () => fitToViewport(true));

      /* =======================================================================
         十一、桌面端悬停浮卡
         ======================================================================= */
      function showTooltip(node, e) {
        if (window.innerWidth <= 820) return;
        ttGlyph.textContent = node.id;
        ttGlyph.style.color = getNodeColor(node);
        ttNote.textContent = node.note;
        ttSeal.classList.toggle('show', Boolean(node.isTraditional));
        ttTag.textContent = node.tag;
        moveTooltip(e);
        hoverTooltip.classList.add('visible');
      }

      function moveTooltip(e) {
        if (window.innerWidth <= 820) return;
        const pad = 16;
        let x = e.clientX + 18;
        let y = e.clientY + 14;
        const w = hoverTooltip.offsetWidth || 220;
        const h = hoverTooltip.offsetHeight || 80;
        if (x + w + pad > window.innerWidth) x = e.clientX - w - 18;
        if (y + h + pad > window.innerHeight) y = e.clientY - h - 14;
        hoverTooltip.style.left = `${x}px`;
        hoverTooltip.style.top = `${y}px`;
      }

      function hideTooltip() {
        hoverTooltip.classList.remove('visible');
      }

      /* =======================================================================
         十二、星宿档案抽屉（11 字米字格交互拆解 + 10 字简繁双镜 + 跃迁流光）
         ======================================================================= */
      function buildDecompHTML(id) {
        const data = DECOMPOSITIONS[id];
        if (!data) return '';

        const strokesSvg = data.strokes.map((st, idx) => {
          if (st.circle) {
            return `<circle class="decomp-stroke" data-sidx="${idx}" cx="${st.circle.cx}" cy="${st.circle.cy}" r="${st.circle.r}" fill="${st.color}" />`;
          }
          return `<path class="decomp-stroke" data-sidx="${idx}" d="${st.d}" fill="none" stroke="${st.color}" stroke-width="${st.width}" stroke-linecap="round" stroke-linejoin="round" />`;
        }).join('');

        const legendHtml = data.strokes.map((st, idx) => `
          <div class="decomp-item" data-sidx="${idx}">
            <span class="decomp-swatch" style="background:${st.color}; box-shadow:0 0 8px ${st.color}88;"></span>
            <div class="decomp-item-text">
              <strong>${st.label}</strong><br />${st.desc}
            </div>
          </div>
        `).join('');

        return `
          <section class="decomp-card">
            <div class="decomp-head">
              <span class="decomp-title">米字格意象拆解</span>
              <span class="decomp-hint">悬停或轻触点亮</span>
            </div>
            <div class="decomp-grid-wrap">
              <div class="decomp-svg-box">
                <svg viewBox="0 0 120 120" width="106" height="106" xmlns="http://www.w3.org/2000/svg">
                  <rect x="6" y="6" width="108" height="108" rx="6" fill="none" stroke="rgba(245,196,105,0.22)" stroke-width="1" />
                  <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(245,196,105,0.16)" stroke-dasharray="3 3" />
                  <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(245,196,105,0.16)" stroke-dasharray="3 3" />
                  <line x1="6" y1="6" x2="114" y2="114" stroke="rgba(245,196,105,0.1)" stroke-dasharray="3 4" />
                  <line x1="114" y1="6" x2="6" y2="114" stroke="rgba(245,196,105,0.1)" stroke-dasharray="3 4" />
                  ${strokesSvg}
                </svg>
              </div>
              <div class="decomp-legend">${legendHtml}</div>
            </div>
          </section>
        `;
      }

      function buildMirrorHTML(id) {
        const m = DUAL_MIRRORS[id];
        if (!m) return '';
        return `
          <section class="mirror-card">
            <div class="mirror-head">
              <span class="mirror-title">✦ 简繁双镜</span>
              <span class="mirror-pair">${m.pair}</span>
            </div>
            <div class="mirror-cols">
              <div class="mirror-col">
                <div class="mirror-col-head">
                  <span class="mirror-char">${m.simpChar}</span>
                  <span class="mirror-tag">简体意象</span>
                </div>
                <p class="mirror-desc">${m.simpDesc}</p>
              </div>
              <div class="mirror-col">
                <div class="mirror-col-head">
                  <span class="mirror-char">${m.tradChar}</span>
                  <span class="mirror-tag">繁体意象</span>
                </div>
                <p class="mirror-desc">${m.tradDesc}</p>
              </div>
            </div>
            <div class="mirror-synth"><span class="mirror-synth-label">合参洞见：</span>${m.synth}</div>
          </section>
        `;
      }

      function renderDrawer(node) {
        const accent = getNodeColor(node);
        const tint = getNodeTint(node);

        const relatedHtml = node.related.map(rid => {
          const rn = NODE_MAP[rid];
          if (!rn) return '';
          const rColor = getNodeColor(rn);
          return `
            <button class="related-chip" type="button" data-jump="${rid}">
              <span class="related-chip-glyph" style="color:${rColor};">${rn.id}</span>
              <span class="related-chip-note">${rn.note}</span>
            </button>
          `;
        }).join('');

        drawerContent.innerHTML = `
          <div class="drawer-hero">
            <div class="hero-glyph-box" style="background:${tint}; border:1.5px solid ${accent}88; color:${accent}; box-shadow:0 0 24px ${accent}24;">
              ${node.id}
              ${node.isTraditional ? '<span class="trad-seal-badge">繁</span>' : ''}
            </div>
            <div class="hero-info">
              <div class="hero-badges">
                <span class="hero-pinyin">${node.pinyin}</span>
                <span class="hero-note-pill">${node.note}</span>
                <span class="hero-domain-pill" style="color:${accent}; background:${tint}; border-color:${accent}55;">
                  ${node.realm}
                </span>
              </div>
              <h2 class="hero-essence">${node.tag}</h2>
            </div>
          </div>

          <div class="formula-box">
            <strong style="color:${accent};">字形脉络：</strong>${node.formula}
          </div>

          ${buildDecompHTML(node.id)}

          <section class="info-section">
            <h3 class="section-heading">
              <span class="section-dot" style="background:${accent};"></span>
              构字隐喻
            </h3>
            <p class="section-text">${node.imagery}</p>
          </section>

          <section class="info-section">
            <h3 class="section-heading">
              <span class="section-dot" style="background:#94a3b8;"></span>
              系统定位
            </h3>
            <p class="section-text">${node.positioning}</p>
          </section>

          ${buildMirrorHTML(node.id)}

          <section class="practice-card" style="background:linear-gradient(135deg, ${tint}, rgba(8,14,30,0.68)); border-color:${accent}48;">
            <div class="practice-label" style="color:${accent};">✦ 观照自省</div>
            <p class="practice-quote">“${node.practice}”</p>
          </section>

          <section class="info-section">
            <h3 class="section-heading">
              <span class="section-dot" style="background:var(--c-core);"></span>
              关联星宿
            </h3>
            <div class="related-chips">${relatedHtml}</div>
          </section>
        `;

        // 绑定米字格意象交互点亮
        const items = drawerContent.querySelectorAll('.decomp-item');
        const strokes = drawerContent.querySelectorAll('.decomp-stroke');
        let pinnedIdx = null;

        function applyDecompHighlight(activeIdx) {
          items.forEach(it => {
            const idx = it.getAttribute('data-sidx');
            it.classList.toggle('active', activeIdx !== null && idx === String(activeIdx));
          });
          strokes.forEach(st => {
            const idx = st.getAttribute('data-sidx');
            if (activeIdx === null) {
              st.style.opacity = '1';
              st.classList.remove('decomp-stroke-active');
            } else if (idx === String(activeIdx)) {
              st.style.opacity = '1';
              st.classList.add('decomp-stroke-active');
            } else {
              st.style.opacity = '0.2';
              st.classList.remove('decomp-stroke-active');
            }
          });
        }

        items.forEach(it => {
          const idx = it.getAttribute('data-sidx');
          it.addEventListener('mouseenter', () => {
            if (pinnedIdx === null) applyDecompHighlight(idx);
          });
          it.addEventListener('mouseleave', () => {
            if (pinnedIdx === null) applyDecompHighlight(null);
          });
          it.addEventListener('click', () => {
            pinnedIdx = pinnedIdx === idx ? null : idx;
            applyDecompHighlight(pinnedIdx);
          });
        });

        strokes.forEach(st => {
          const idx = st.getAttribute('data-sidx');
          st.addEventListener('click', () => {
            pinnedIdx = pinnedIdx === idx ? null : idx;
            applyDecompHighlight(pinnedIdx);
          });
        });

        // 关联星宿飞掠跃迁 + 短暂流光金弧
        drawerContent.querySelectorAll('[data-jump]').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-jump');
            if (state.tourActive) stopTour(false);
            if (state.metaRulerActive && !META_RULER_SET.has(targetId)) {
              state.metaRulerActive = false;
            }
            if (state.jumpTimer) clearTimeout(state.jumpTimer);
            state.jumpArc = { from: node.id, to: targetId };
            state.jumpTimer = setTimeout(() => {
              state.jumpArc = null;
              updateVisuals();
            }, 1900);
            selectNode(targetId, true);
          });
        });
      }

      function selectNode(id, panToNode = true, openPanel = true) {
        const node = NODE_MAP[id];
        if (!node) return;
        state.selectedId = id;
        if (openPanel) {
          renderDrawer(node);
          detailDrawer.classList.add('open');
          document.body.classList.add('card-reading');
          zoomCapsule.classList.add('drawer-shifted');
          drawerContent.scrollTop = 0;
        }
        updateVisuals();
        if (panToNode) focusNodesSmooth([id]);
      }

      function closeDrawer() {
        if (!detailDrawer.classList.contains('open') && !state.selectedId) return;
        state.selectedId = null;
        detailDrawer.classList.remove('open');
        document.body.classList.remove('card-reading');
        zoomCapsule.classList.remove('drawer-shifted');
        updateVisuals();
      }

      drawerCloseBtn.addEventListener('click', closeDrawer);

      // 移动端底部抽屉支持下拉关闭
      let handleStartY = null;
      drawerHandleBar.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) handleStartY = e.touches[0].clientY;
      }, { passive: true });
      drawerHandleBar.addEventListener('touchend', (e) => {
        if (handleStartY !== null && e.changedTouches.length === 1) {
          if (e.changedTouches[0].clientY - handleStartY > 42) closeDrawer();
        }
        handleStartY = null;
      }, { passive: true });

      /* =======================================================================
         十三、顶部三联控制按钮（星注、「一」元标尺、九章漫游）
         ======================================================================= */
      starNoteBtn.addEventListener('click', () => {
        state.showStarNotes = !state.showStarNotes;
        updateVisuals();
      });

      function toggleMetaRuler(forceVal = null, fitView = true) {
        const next = forceVal === null ? !state.metaRulerActive : forceVal;
        if (next && state.tourActive) stopTour(false);
        state.metaRulerActive = next;
        if (next) {
          state.activeFilter = 'all';
          refreshFilterPills();
        }
        updateVisuals();
        if (next && fitView) fitToViewport(true);
      }

      metaRulerBtn.addEventListener('click', () => toggleMetaRuler(null, true));
      closeMetaBannerBtn.addEventListener('click', () => toggleMetaRuler(false, false));

      /* 九章漫游 */
      function buildTourDots() {
        tourDots.innerHTML = '';
        TOUR_CHAPTERS.forEach((ch, idx) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'tour-dot';
          dot.title = `${ch.numeral} · ${ch.title}`;
          dot.addEventListener('click', () => goToTourChapter(idx));
          tourDots.appendChild(dot);
        });
      }

      function goToTourChapter(idx) {
        if (idx < 0 || idx >= TOUR_CHAPTERS.length) return;
        state.tourIndex = idx;
        const ch = TOUR_CHAPTERS[idx];
        state.tourFocusSet = new Set(ch.focus);
        state.metaRulerActive = Boolean(ch.metaRuler);

        tourNumeral.textContent = ch.numeral;
        tourTitle.textContent = ch.title;
        tourBody.textContent = ch.body;
        tourPrevBtn.disabled = idx === 0;
        tourNextBtn.textContent = idx === TOUR_CHAPTERS.length - 1 ? '圆满收官' : '下一章';

        tourDots.querySelectorAll('.tour-dot').forEach((d, i) => {
          d.classList.toggle('active', i === idx);
        });

        const isDesktop = window.innerWidth > 900;
        if (isDesktop && ch.openId) {
          state.selectedId = ch.openId;
          renderDrawer(NODE_MAP[ch.openId]);
          detailDrawer.classList.add('open');
          document.body.classList.add('card-reading');
          zoomCapsule.classList.add('drawer-shifted');
        } else if (!isDesktop) {
          detailDrawer.classList.remove('open');
          document.body.classList.remove('card-reading');
          zoomCapsule.classList.remove('drawer-shifted');
          state.selectedId = ch.openId || null;
        }

        updateVisuals();
        if (ch.overview) fitToViewport(true);
        else focusNodesSmooth(ch.focus, ch.scale);
      }

      function startTour() {
        state.tourActive = true;
        state.activeFilter = 'all';
        refreshFilterPills();
        tourCard.classList.add('visible');
        goToTourChapter(0);
      }

      function stopTour(resetView = false) {
        state.tourActive = false;
        state.tourFocusSet = null;
        tourCard.classList.remove('visible');
        updateVisuals();
        if (resetView) fitToViewport(true);
      }

      tourBtn.addEventListener('click', () => {
        if (state.tourActive) stopTour(false);
        else startTour();
      });
      tourCloseBtn.addEventListener('click', () => stopTour(false));
      tourPrevBtn.addEventListener('click', () => goToTourChapter(state.tourIndex - 1));
      tourNextBtn.addEventListener('click', () => {
        if (state.tourIndex >= TOUR_CHAPTERS.length - 1) stopTour(false);
        else goToTourChapter(state.tourIndex + 1);
      });

      /* =======================================================================
         十四、底部星域导航栏与无字小搜索框实时检索
         ======================================================================= */
      const FILTER_ITEMS = [
        { id: 'all', label: '全部', color: '#f5c469' },
        { id: 'core', label: '演化主脉', color: DOMAINS.core.color },
        { id: 'calib', label: '知行校准', color: DOMAINS.calib.color },
        { id: 'wood', label: '木系根基', color: DOMAINS.wood.color },
        { id: 'craft', label: '形态打磨', color: DOMAINS.craft.color },
        { id: 'delivery', label: '价值交付', color: DOMAINS.delivery.color },
        { id: 'moat', label: '长期壁垒', color: DOMAINS.moat.color },
        { id: 'shadow', label: '系统暗面', color: DOMAINS.shadow.color },
        { id: 'leap', label: '高维化境', color: DOMAINS.leap.color }
      ];

      function initFilterBar() {
        filterBar.innerHTML = '';
        FILTER_ITEMS.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-pill' + (item.id === 'all' ? ' active' : '');
          btn.setAttribute('data-filter', item.id);
          btn.style.setProperty('--pill-border', `${item.color}88`);
          btn.style.setProperty('--pill-glow', `${item.color}30`);
          btn.innerHTML = `<span class="pill-dot" style="background:${item.color};"></span><span>${item.label}</span>`;

          btn.addEventListener('click', () => {
            if (state.tourActive) stopTour(false);
            if (state.metaRulerActive) state.metaRulerActive = false;

            const isSecondClick = item.id !== 'all' && state.activeFilter === item.id;
            state.activeFilter = isSecondClick ? 'all' : item.id;
            refreshFilterPills();
            updateVisuals();

            if (state.activeFilter === 'all') {
              fitToViewport(true);
            } else {
              const matched = NODES.filter(n => nodeMatchesFilter(n)).map(n => n.id);
              if (matched.length) focusNodesSmooth(matched);
            }
          });
          filterBar.appendChild(btn);
        });
      }

      function refreshFilterPills() {
        filterBar.querySelectorAll('.filter-pill').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-filter') === state.activeFilter);
        });
      }

      function renderSearchResults(q) {
        const query = q.trim();
        searchClearBtn.classList.toggle('visible', query.length > 0);
        if (!query) {
          searchDropdown.classList.remove('open');
          searchDropdown.innerHTML = '';
          return;
        }
        const lower = query.toLowerCase();
        const matches = NODES.filter(n => {
          const m = DUAL_MIRRORS[n.id];
          return (
            n.id.includes(query) ||
            n.note.includes(query) ||
            n.pinyin.toLowerCase().includes(lower) ||
            n.tag.includes(query) ||
            n.realm.includes(query) ||
            DOMAINS[n.domain].name.includes(query) ||
            (n.isTraditional && (query === '繁' || '繁体遗珠'.includes(query))) ||
            (m && (m.pair.includes(query) || '简繁双镜'.includes(query)))
          );
        });

        if (!matches.length) {
          searchDropdown.innerHTML = '<div class="search-empty">星海未寻得此关键词</div>';
        } else {
          searchDropdown.innerHTML = matches.slice(0, 10).map(n => {
            const c = getNodeColor(n);
            const t = getNodeTint(n);
            return `
              <button class="search-item" type="button" data-pick="${n.id}">
                <span class="search-item-glyph" style="background:${t}; color:${c}; border:1px solid ${c}55;">${n.id}</span>
                <div class="search-item-meta">
                  <div class="search-item-top">
                    <span class="search-item-note">${n.note}</span>
                    <span class="search-item-domain">${DOMAINS[n.domain].name}</span>
                  </div>
                  <div class="search-item-tag">${n.tag}</div>
                </div>
              </button>
            `;
          }).join('');

          searchDropdown.querySelectorAll('[data-pick]').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-pick');
              if (state.tourActive) stopTour(false);
              if (state.metaRulerActive && !META_RULER_SET.has(id)) state.metaRulerActive = false;
              state.activeFilter = 'all';
              refreshFilterPills();
              searchDropdown.classList.remove('open');
              searchInput.blur();
              if (id === '一') {
                triggerMainAxisPulse();
              }
              selectNode(id, true);
            });
          });
        }
        searchDropdown.classList.add('open');
      }

      searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim()) renderSearchResults(searchInput.value);
      });
      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        renderSearchResults('');
        searchInput.focus();
      });

      document.addEventListener('click', (e) => {
        const wrap = document.getElementById('searchWrap');
        if (wrap && !wrap.contains(e.target)) {
          searchDropdown.classList.remove('open');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchDropdown.classList.remove('open');
          if (state.tourActive) stopTour(false);
          else if (detailDrawer.classList.contains('open')) closeDrawer();
          else if (state.metaRulerActive) toggleMetaRuler(false, false);
        }
      });

      /* =======================================================================
         十五、初始化启动
         ======================================================================= */
      initStarfieldCanvas();
      buildStarMap();
      initFilterBar();
      buildTourDots();
      updateVisuals();
      fitToViewport(false);
      window.requestAnimationFrame(() => fitToViewport(false));

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!state.selectedId && !state.tourActive) {
            fitToViewport(true);
          }
        }, 180);
      });
    });
  </script>
</body>
</html>
