<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>一 · 十 · 木 · 米 汉字演化星图</title>
  <style>
    :root {
      --bg-deep: #060a14;
      --bg-mid: #0c1428;
      --bg-edge: #080d1a;
      --glass-bg: rgba(9, 15, 30, 0.78);
      --glass-card: rgba(10, 14, 28, 0.94);
      --glass-strong: rgba(8, 13, 27, 0.93);
      --glass-border: rgba(255, 255, 255, 0.12);
      --card-gold-border: rgba(218, 190, 134, 0.22);
      --text-main: #f4f6fb;
      --text-sub: #a6b4cd;
      --text-muted: #70809e;
      --gold: #f5c469;
      --gold-soft: #fde68a;
      --silver-cyan: #93b7c8;
      --jade: #34d399;
      --amber: #f59e0b;
      --teal: #38bdf8;
      --indigo: #818cf8;
      --crimson: #e1526d;
      --violet: #c084fc;
      --cinnabar: #c83e37;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", Georgia, serif;
      --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 63% 47%, var(--bg-mid) 0%, var(--bg-edge) 52%, var(--bg-deep) 100%);
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* 背景星尘画布 */
    #starfieldCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 主交互星图舞台 */
    #mapStage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
      overflow: hidden;
    }
    #mapStage.dragging {
      cursor: grabbing;
    }

    #starMapSvg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* SVG 流光与呼吸动效 */
    @keyframes flowDash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes slowFlowDash {
      to { stroke-dashoffset: -96; }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.42; }
      50% { transform: scale(1.13); opacity: 0.14; }
    }
    @keyframes yiPulseTravel {
      0% { stroke-dashoffset: 1680; opacity: 0.96; }
      74% { opacity: 0.92; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes jumpArcFade {
      0% { stroke-dashoffset: 420; opacity: 0; }
      18% { opacity: 0.96; }
      82% { stroke-dashoffset: 0; opacity: 0.86; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .axis-flow-line {
      stroke-dasharray: 12 18;
      animation: flowDash 4.2s linear infinite;
    }
    .meta-ruler-flow {
      stroke-dasharray: 10 14;
      animation: slowFlowDash 3.5s linear infinite;
    }
    .yi-pulse-path {
      stroke-dasharray: 220 1680;
      animation: yiPulseTravel 1.05s cubic-bezier(0.22, 0.8, 0.35, 1) forwards;
    }
    .jump-arc-path {
      stroke-dasharray: 420;
      animation: jumpArcFade 1.85s ease-out forwards;
    }

    .star-node {
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .star-node .node-core-ring {
      transition: stroke-width 0.24s ease, fill 0.24s ease, filter 0.24s ease;
    }
    .star-node .node-halo-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseRing 4.2s ease-in-out infinite;
    }
    .star-node .node-glyph {
      font-family: var(--font-serif);
      font-weight: 600;
      pointer-events: none;
      dominant-baseline: central;
      text-anchor: middle;
    }
    .star-node .node-note {
      font-family: var(--font-sans);
      font-size: 12.5px;
      letter-spacing: 0.08em;
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(6, 10, 20, 0.92);
      stroke-width: 3.4px;
      stroke-linejoin: round;
      transition: opacity 0.3s ease, fill 0.3s ease;
    }
    .star-node .seal-text {
      font-family: var(--font-serif);
      font-size: 8.5px;
      font-weight: 700;
      fill: #fff6f2;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* 七大外绕星域竖排柔色边款 */
    .domain-marginalia {
      pointer-events: none;
      transition: opacity 0.22s ease-out;
    }
    .marginalia-text {
      font-family: var(--font-serif);
      font-size: 16.5px;
      font-weight: 600;
      paint-order: stroke;
      stroke: rgba(6, 10, 20, 0.94);
      stroke-width: 4.4px;
      stroke-linejoin: round;
    }

    /* ======================== 顶部双行毛玻璃悬浮题签 ======================== */
    .top-header-wrap {
      position: fixed;
      top: 10px;
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .top-header {
      width: 100%;
      max-width: 780px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 8px 12px 9px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-row-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .starburst-emblem {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(245, 196, 105, 0.48));
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: #f8f4e8;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-family: var(--font-serif);
      font-size: 12.5px;
      letter-spacing: 0.18em;
      color: rgba(214, 224, 242, 0.56);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-row-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .search-wrap {
      position: relative;
      flex: 0 1 118px;
      min-width: 52px;
      transition: flex-basis 0.25s ease;
    }
    .search-wrap:focus-within {
      flex-basis: 172px;
    }

    .search-box {
      display: flex;
      align-items: center;
      height: 31px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 0 7px 0 9px;
      gap: 5px;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .search-box:focus-within {
      background: rgba(14, 22, 44, 0.92);
      border-color: rgba(245, 196, 105, 0.52);
      box-shadow: 0 0 0 2px rgba(245, 196, 105, 0.14);
    }

    .search-icon {
      width: 13px;
      height: 13px;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1;
      padding: 0;
    }

    .search-clear {
      display: none;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }
    .search-clear.visible {
      display: inline-flex;
    }

    /* 搜索下拉列表：未激活时严格隐匿 */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 248px;
      max-width: calc(100vw - 28px);
      max-height: 270px;
      overflow-y: auto;
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.56);
      z-index: 70;
      display: none;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .search-dropdown.open {
      display: block;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .search-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 9px;
      border: none;
      background: transparent;
      color: var(--text-main);
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: background 0.16s ease;
    }
    .search-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .search-item-glyph {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .search-item-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .search-item-note {
      font-size: 13px;
      color: #f2f5fb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-item-domain {
      font-size: 11px;
      color: var(--text-sub);
    }
    .search-empty {
      padding: 14px 10px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .ctrl-pill {
      height: 31px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.045);
      color: #cbd5e1;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .ctrl-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .ctrl-pill .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.22s ease, box-shadow 0.22s ease;
    }

    .ctrl-pill.note-active {
      background: rgba(245, 196, 105, 0.14);
      border-color: rgba(245, 196, 105, 0.45);
      color: #fce7b2;
      box-shadow: 0 0 14px rgba(245, 196, 105, 0.15);
    }
    .ctrl-pill.note-active .pill-dot {
      background: #f5c469;
      box-shadow: 0 0 8px rgba(245, 196, 105, 0.9);
    }
    .ctrl-pill.note-off {
      background: rgba(100, 116, 139, 0.12);
      border-color: rgba(148, 163, 184, 0.18);
      color: #8b99b0;
    }

    .ctrl-pill.meta-active {
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.18), rgba(192, 132, 252, 0.22));
      border-color: rgba(226, 232, 240, 0.54);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(192, 132, 252, 0.28);
    }

    .ctrl-pill.tour-active {
      background: rgba(52, 211, 153, 0.16);
      border-color: rgba(52, 211, 153, 0.48);
      color: #c8fce7;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.2);
    }

    /* ======================== 「一」元标尺诗意浮条 ======================== */
    .meta-banner {
      position: fixed;
      top: 102px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 28;
      max-width: calc(100vw - 24px);
      background: rgba(11, 17, 35, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.34);
      border-radius: 999px;
      padding: 7px 10px 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 22px rgba(192, 132, 252, 0.18);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.26s ease, transform 0.26s ease, visibility 0.26s ease;
    }
    .meta-banner.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .meta-banner-star {
      color: #f5c469;
      font-size: 13px;
      flex-shrink: 0;
    }
    .meta-banner-text {
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #edf2ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-banner-text .hl-gold {
      color: #f8d483;
      font-weight: 600;
    }
    .meta-banner-text .hl-violet {
      color: #d8b4fe;
      font-weight: 600;
    }
    .meta-banner-close {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .meta-banner-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* ======================== 右侧独立竖向缩放胶囊 ======================== */
    .zoom-capsule {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 25;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      transition:
        right 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.28s ease,
        filter 0.28s ease;
    }
    .zoom-capsule.drawer-shifted {
      right: 422px;
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #dce5f5;
      font-size: 17px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .zoom-btn.reset-btn {
      font-size: 11px;
      letter-spacing: 0.04em;
      height: 30px;
      color: #b7c4dc;
    }
    .zoom-divider {
      width: 18px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ======================== 底部星域筛选导航栏 ======================== */
    .filter-dock-wrap {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      padding: 0 14px;
      pointer-events: none;
      transition: opacity 0.28s ease, filter 0.28s ease;
    }

    .filter-dock {
      position: relative;
      max-width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 5px 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.46);
      pointer-events: auto;
      overflow: hidden;
    }

    .filter-scroll {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      flex-shrink: 0;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #b6c3db;
      font-family: var(--font-sans);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .filter-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .filter-pill.active {
      background: rgba(245, 196, 105, 0.16);
      border-color: rgba(245, 196, 105, 0.44);
      color: #fef3d6;
      font-weight: 500;
    }
    .filter-swatch {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ======================== 方案三 · 阅读态背景压暗锁定 ======================== */
    body.card-reading .filter-dock-wrap,
    body.card-reading .zoom-capsule {
      opacity: 0.14;
      filter: blur(0.8px);
      pointer-events: none;
    }
    body.card-reading .filter-dock {
      pointer-events: none;
    }

    /* ======================== 九章漫游浮卡 ======================== */
    .tour-card {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%) translateY(18px);
      width: 520px;
      max-width: calc(100vw - 24px);
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 196, 105, 0.32);
      border-radius: 18px;
      padding: 15px 18px 14px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.58), 0 0 26px rgba(245, 196, 105, 0.1);
      z-index: 32;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s ease;
    }
    .tour-card.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .tour-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .tour-chapter-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tour-numeral {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(245, 196, 105, 0.18);
      border: 1px solid rgba(245, 196, 105, 0.5);
      color: #fde68a;
      font-family: var(--font-serif);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tour-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15.5px;
      font-weight: 600;
      color: #faf6eb;
      letter-spacing: 0.05em;
    }
    .tour-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tour-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .tour-dot.active {
      width: 16px;
      border-radius: 999px;
      background: #f5c469;
    }

    .tour-body {
      margin: 0 0 12px;
      font-size: 13.5px;
      line-height: 1.7;
      color: #d6dff0;
    }

    .tour-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tour-nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tour-btn {
      height: 30px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .tour-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .tour-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .tour-btn.primary {
      background: rgba(245, 196, 105, 0.2);
      border-color: rgba(245, 196, 105, 0.5);
      color: #fef3d6;
    }
    .tour-btn.primary:hover {
      background: rgba(245, 196, 105, 0.3);
    }

    /* ======================== 星宿档案 · 悬浮星笺（方案三） ======================== */
    .detail-drawer {
      position: fixed;
      top: 86px;
      right: 18px;
      bottom: 84px;
      width: 390px;
      max-width: calc(100vw - 36px);
      background: var(--glass-card);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-gold-border);
      border-radius: 22px;
      box-shadow:
        0 20px 54px rgba(0, 0, 0, 0.68),
        0 0 28px rgba(245, 196, 105, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      z-index: 60;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(30px) scale(0.985);
      transition:
        opacity 0.28s ease,
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0.28s ease;
    }
    .detail-drawer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0) scale(1);
    }

    /* 顶部极薄顶栏 + 顶缘正中极小星饰「· ✦ ·」 */
    .drawer-header {
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0));
    }

    .drawer-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 0 1px;
      font-size: 9.5px;
      line-height: 1;
      letter-spacing: 0.44em;
      padding-left: 0.44em;
      color: rgba(245, 196, 105, 0.56);
      text-shadow: 0 0 8px rgba(245, 196, 105, 0.32);
      pointer-events: none;
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 16px 8px;
    }
    .drawer-kicker {
      font-family: var(--font-serif);
      font-size: 11.5px;
      letter-spacing: 0.26em;
      color: rgba(203, 215, 236, 0.78);
    }
    .drawer-close {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #dbe4f4;
      font-size: 15px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }
    .drawer-close:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(245, 196, 105, 0.38);
      color: #fff;
    }

    /* 可滚动内容容器 + 内底缘柔光渐隐遮罩 */
    .drawer-body-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 36px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      user-select: text;
      -webkit-user-select: text;
    }
    .drawer-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .drawer-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    .drawer-bottom-fade {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        rgba(10, 14, 28, 0) 0%,
        rgba(10, 14, 28, 0.85) 68%,
        rgba(10, 14, 28, 0.98) 100%
      );
    }

    .drawer-hero {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 13px;
    }
    .hero-glyph-box {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .trad-seal-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 19px;
      height: 19px;
      border-radius: 5px;
      background: var(--cinnabar);
      border: 1px solid #f7a69f;
      color: #fff7f5;
      font-family: var(--font-serif);
      font-size: 10.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(200, 62, 55, 0.5);
    }

    .hero-info {
      min-width: 0;
      flex: 1;
    }
    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .hero-pinyin {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }
    .hero-note-pill {
      font-size: 11px;
      padding: 2px 7.5px;
      border-radius: 999px;
      background: rgba(245, 196, 105, 0.14);
      border: 1px solid rgba(245, 196, 105, 0.36);
      color: #fce7b2;
    }
    .hero-domain-pill {
      font-size: 11px;
      padding: 2px 7.5px;
      border-radius: 999px;
      border: 1px solid;
    }
    .hero-essence {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.52;
      color: #f6f8fc;
    }

    .formula-box {
      padding: 8.5px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.042);
      border: 1px solid rgba(255, 255, 255, 0.085);
      font-size: 12.2px;
      line-height: 1.62;
      color: #d6e0f2;
      margin-bottom: 13px;
    }

    /* 繁体遗珠朱砂印笺 */
    .relic-note-box {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 8.5px 11px;
      border-radius: 12px;
      background: rgba(200, 62, 55, 0.12);
      border: 1px solid rgba(200, 62, 55, 0.36);
      font-size: 12px;
      line-height: 1.6;
      color: #fbd5d2;
      margin-bottom: 13px;
    }
    .relic-mini-seal {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: var(--cinnabar);
      border: 1px solid #f7a69f;
      color: #fff6f2;
      font-family: var(--font-serif);
      font-size: 10.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .section-block {
      margin-bottom: 14px;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #b7c5de;
      margin: 0 0 6px;
    }
    .section-label-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .section-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.75;
      color: #d8e1f0;
    }

    /* 观照自省卡片 */
    .practice-card {
      padding: 11px 13px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(245, 196, 105, 0.085), rgba(129, 140, 248, 0.075));
      border: 1px solid rgba(245, 196, 105, 0.25);
      margin-bottom: 15px;
    }
    .practice-title {
      font-size: 11.5px;
      letter-spacing: 0.14em;
      color: #f5c469;
      margin: 0 0 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .practice-quote {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 13.5px;
      line-height: 1.72;
      color: #fef6e4;
    }

    /* 米字格交互解构器 */
    .migrid-card {
      padding: 11px;
      border-radius: 14px;
      background: rgba(7, 11, 24, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.09);
      margin-bottom: 15px;
    }
    .migrid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }
    .migrid-hint {
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .migrid-layout {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .migrid-svg-wrap {
      width: 106px;
      height: 106px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(15, 23, 44, 0.8);
      border: 1px solid rgba(245, 196, 105, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .migrid-svg {
      width: 98px;
      height: 98px;
      display: block;
    }
    .decomp-stroke {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      transition: opacity 0.22s ease, stroke-width 0.22s ease, filter 0.22s ease;
    }
    .migrid-tags {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5.5px;
    }
    .decomp-tag {
      width: 100%;
      text-align: left;
      padding: 6px 8.5px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.035);
      color: #d6e0f2;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .decomp-tag:hover,
    .decomp-tag.active {
      background: rgba(245, 196, 105, 0.14);
      border-color: rgba(245, 196, 105, 0.45);
      color: #fff;
    }
    .decomp-tag-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.8px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .decomp-tag-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .decomp-tag-desc {
      font-size: 11px;
      line-height: 1.44;
      color: #9ba9c4;
    }

    /* 简繁双镜三栏对照卡 */
    .mirror-card {
      padding: 11px;
      border-radius: 14px;
      background: linear-gradient(155deg, rgba(192, 132, 252, 0.085), rgba(56, 189, 248, 0.05));
      border: 1px solid rgba(192, 132, 252, 0.24);
      margin-bottom: 15px;
    }
    .mirror-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .mirror-col {
      padding: 8px 9px;
      border-radius: 10px;
      background: rgba(8, 13, 28, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .mirror-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .mirror-char {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 600;
      color: #faf5ff;
    }
    .mirror-kind {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #c7d2e8;
    }
    .mirror-col-text {
      margin: 0;
      font-size: 11.3px;
      line-height: 1.54;
      color: #c9d5ea;
    }
    .mirror-synthesis {
      padding: 8px 9.5px;
      border-radius: 10px;
      background: rgba(245, 196, 105, 0.09);
      border: 1px solid rgba(245, 196, 105, 0.22);
      font-size: 11.8px;
      line-height: 1.58;
      color: #f8ebd0;
    }

    /* 关联星宿跃迁 */
    .related-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6.5px;
    }
    .related-chip {
      display: inline-flex;
      align-items: center;
      gap: 5.5px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.045);
      color: #dce5f5;
      font-size: 11.8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .related-chip:hover {
      background: rgba(245, 196, 105, 0.14);
      border-color: rgba(245, 196, 105, 0.44);
      transform: translateY(-1px);
    }
    .related-chip-glyph {
      font-family: var(--font-serif);
      font-size: 13.5px;
      font-weight: 600;
    }
    .related-chip-note {
      color: #b4c2db;
      font-size: 11.2px;
    }

    /* ======================== 移动端适配（375px 零裁切 + 四边悬空悬浮星笺） ======================== */
    @media (max-width: 768px) {
      .top-header-wrap {
        top: 8px;
        left: 8px;
        right: 8px;
      }
      .top-header {
        padding: 7px 9px 8px;
        border-radius: 14px;
        gap: 7px;
      }
      .brand-title {
        font-size: 14.5px;
        letter-spacing: 0.12em;
      }
      .brand-subtitle {
        font-size: 11.5px;
        letter-spacing: 0.12em;
      }
      .header-row-controls {
        gap: 5px;
      }
      .search-wrap {
        flex: 1 1 54px;
        min-width: 46px;
      }
      .search-wrap:focus-within {
        flex: 1 1 86px;
      }
      .search-box {
        height: 29px;
        padding: 0 5px 0 7px;
      }
      .search-input {
        font-size: 16px;
        transform: scale(0.8125);
        transform-origin: left center;
        width: 123%;
      }
      .ctrl-group {
        gap: 4px;
      }
      .ctrl-pill {
        height: 29px;
        padding: 0 7.5px;
        font-size: 11px;
        gap: 4px;
      }

      .meta-banner {
        top: 92px;
        padding: 6px 8px 6px 12px;
        gap: 7px;
      }
      .meta-banner-text {
        font-size: 11.5px;
        letter-spacing: 0.03em;
      }

      .zoom-capsule {
        right: 10px;
        bottom: 66px;
        padding: 4px;
      }
      .zoom-capsule.drawer-shifted {
        right: 10px;
      }
      .zoom-btn {
        width: 31px;
        height: 31px;
        font-size: 16px;
      }

      .filter-dock-wrap {
        bottom: 0;
        padding: 0;
      }
      .filter-dock {
        width: 100%;
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 7px 0 calc(7px + env(safe-area-inset-bottom, 0px));
      }
      .filter-dock::before,
      .filter-dock::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 24px;
        z-index: 2;
        pointer-events: none;
      }
      .filter-dock::before {
        left: 0;
        background: linear-gradient(90deg, rgba(9, 15, 30, 0.96), transparent);
      }
      .filter-dock::after {
        right: 0;
        background: linear-gradient(270deg, rgba(9, 15, 30, 0.96), transparent);
      }
      .filter-scroll {
        padding: 0 14px;
      }

      .tour-card {
        bottom: 58px;
        padding: 13px 14px 12px;
      }
      .tour-title {
        font-size: 14.5px;
      }
      .tour-body {
        font-size: 12.5px;
      }

      /* 移动端四边完整悬空圆角「悬浮星笺」 */
      .detail-drawer {
        top: auto;
        left: 14px;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        width: auto;
        max-width: none;
        max-height: 62vh;
        background: rgba(10, 14, 28, 0.94);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border: 1px solid rgba(218, 190, 134, 0.22);
        border-radius: 22px;
        overflow: hidden;
        z-index: 60;
        box-shadow:
          0 22px 54px rgba(0, 0, 0, 0.72),
          0 0 28px rgba(245, 196, 105, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transform: translateY(34px) scale(0.98);
      }
      .detail-drawer.open {
        transform: translateY(0) scale(1);
      }
      .drawer-ornament {
        padding: 6px 0 1px;
        font-size: 9px;
      }
      .drawer-top {
        padding: 2px 15px 7px;
      }
      .drawer-close {
        width: 26px;
        height: 26px;
        font-size: 15px;
      }
      .drawer-scroll {
        padding: 12px 15px 36px;
      }
      .drawer-hero {
        gap: 11px;
        margin-bottom: 11px;
      }
      .hero-glyph-box {
        width: 58px;
        height: 58px;
        border-radius: 15px;
        font-size: 31px;
      }
      .hero-essence {
        font-size: 14px;
      }
      .migrid-layout {
        flex-direction: column;
        align-items: stretch;
      }
      .migrid-svg-wrap {
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <!-- 背景星尘画布 -->
  <canvas id="starfieldCanvas" aria-hidden="true"></canvas>

  <!-- 主交互星图画布 -->
  <div id="mapStage" role="application" aria-label="一 · 十 · 木 · 米 汉字演化星图">
    <svg id="starMapSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 主轴鎏金至翠玉流光渐变 -->
        <linearGradient id="axisGradient" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f5c469" stop-opacity="0.92" />
          <stop offset="32%" stop-color="#f0c878" stop-opacity="0.95" />
          <stop offset="64%" stop-color="#6ee7b7" stop-opacity="0.92" />
          <stop offset="100%" stop-color="#f7cf7d" stop-opacity="1" />
        </linearGradient>

        <!-- 七星元标尺铂金紫辉渐变 -->
        <linearGradient id="metaRulerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fde68a" />
          <stop offset="45%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#d8b4fe" />
        </linearGradient>

        <!-- 星域径向星云柔光 -->
        <radialGradient id="nebulaMi" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5c469" stop-opacity="0.16" />
          <stop offset="45%" stop-color="#818cf8" stop-opacity="0.07" />
          <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="nebulaWood" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#34d399" stop-opacity="0.13" />
          <stop offset="55%" stop-color="#34d399" stop-opacity="0.03" />
          <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="nebulaTen" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#93b7c8" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="nebulaCrown" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c084fc" stop-opacity="0.14" />
          <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="nebulaShadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e1526d" stop-opacity="0.11" />
          <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
        </radialGradient>

        <!-- 柔光与边款暗影滤镜 -->
        <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glowStrong" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="marginaliaShadow" x="-60%" y="-25%" width="220%" height="150%">
          <feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#040710" flood-opacity="0.95" />
        </filter>
      </defs>

      <!-- 2600 × 1450 逻辑星野空间 -->
      <g id="viewportGroup">
        <g id="nebulaLayer"></g>
        <g id="orbitLayer"></g>
        <g id="linksLayer"></g>
        <g id="axisLayer"></g>
        <g id="metaRulerLayer"></g>
        <g id="dynamicArcLayer"></g>
        <g id="marginaliaLayer"></g>
        <g id="nodesLayer"></g>
      </g>
    </svg>
  </div>

  <!-- 顶部双行毛玻璃悬浮题签 -->
  <header class="top-header-wrap">
    <div class="top-header">
      <div class="header-row-title">
        <div class="brand-left">

      /* =====================================================================
         七、背景星尘粒子画布
         ===================================================================== */
      function initStarfieldCanvas() {
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let stars = [];
        let w = 0, h = 0;

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const count = Math.min(180, Math.max(70, Math.floor((w * h) / 9500)));
          stars = [];
          for (let i = 0; i < count; i++) {
            const huePick = Math.random();
            let col = '226, 232, 240';
            if (huePick < 0.22) col = '245, 196, 105';
            else if (huePick < 0.38) col = '147, 197, 253';
            else if (huePick < 0.48) col = '192, 132, 252';
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: Math.random() * 1.45 + 0.35,
              baseA: Math.random() * 0.48 + 0.14,
              speed: Math.random() * 0.015 + 0.004,
              phase: Math.random() * Math.PI * 2,
              col
            });
          }
        }

        resize();
        window.addEventListener('resize', resize);

        function tick(ts) {
          ctx.clearRect(0, 0, w, h);
          const t = ts * 0.06;
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const alpha = Math.max(0.06, Math.min(0.85, s.baseA + Math.sin(t * s.speed + s.phase) * 0.24));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${s.col}, ${alpha.toFixed(3)})`;
            ctx.fill();
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
